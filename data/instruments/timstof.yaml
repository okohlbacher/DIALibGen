# Bruker timsTOF, diaPASEF (docs/usage.md#instrument-defaults).
# Sources:
#   charges 2-4: the owner chose 2-4 on 2026-10-19 after the timsTOF benchmark: charge 1
#     +11.7 % library, +0.03 % IDs (report section "timsTOF (diaPASEF)": PXD029836,
#     three runs, DIA-NN 2.0; 34-48 identified 1+ precursors per run, total
#     precursors and protein groups equal within 0.13 %). DIA-NN 2.0's README
#     recommends the same ("always set minimum precursor charge to 2 ... for
#     searching timsTOF data"): 1+ ions are censored at the top of the mobility
#     ramp. The 0.12.1 default was 1-4; -generation:precursor_charges 1 2 3 4
#     restores it.
#   precursor m/z 350-1200, fragment m/z 200-1800: the timsTOF recipe of the report's
#     section 3 and the digest of both diaPASEF benchmarks (DIA-NN --min-pr-mz 350
#     --max-pr-mz 1200 --min-fr-mz 200 --max-fr-mz 1800); their identified
#     precursors span m/z 400-1200 (benchmark/audits/audit4.md).
#   nce 30: the section 3 recipe and upstream's timsTOF default, confirmed on two
#     public diaPASEF methods (all b/y ions at z 1-3 from the raw spectra, scripts/eval/
#     fragment_intensity_eval.py; DIA-NN 2.0 precursors at 1 % FDR, charges 2-4):
#       PXD041421 (CE 26-46 eV): 30 is best for every precursor charge (median
#         cosine 0.888 / 0.885 on the two runs; 25: 0.881 / 0.877; 20: 0.875 / 0.870);
#         IDs at 25 +1.0 % / -0.7 %, at 20 +0.4 % / -1.7 %;
#       PXD029836 (CE 20-57 eV): 20 is best (0.884 against 0.868; 4+ precursors 40),
#         IDs at 25 +1.0 %, at 20 +2.2 %.
#     The best NCE follows the method's collision-energy ramp, so no single value or
#     per-charge set (nce_by_charge) improves both; 30 is kept. For a method like
#     PXD029836's, a copy of this file with nce 20 or nce_by_charge (e.g. {4: 40})
#     can be given with -instrument_file.
#   mobility_correction: the 1/K0 derived from the stock CCS model (Mason-Schamp,
#     N2, 305 K; the same constants as alphabase's ccs_to_mobility_bruker within
#     5e-5) is low on diaPASEF, by a median 0.014 on the timsTOF benchmark
#     (PXD029836), more at low mobility and high charge. These lines were fitted
#     by least squares (residuals beyond 4 robust SD trimmed, both runs weighted
#     equally) to the observed 1/K0 of the precursors DIA-NN 2.0 identified at
#     1 % FDR in two public timsTOF Pro diaPASEF runs from two instruments
#     (PXD041421, files ..._3197.d and ..._9898.d; 192,043 precursors) searched
#     with DIALibGen 0.12.1's timsTOF library. On PXD029836 (not used for the
#     fit) they take the median |d1/K0| of run 01's held-out proteins from 0.0154
#     to 0.0104 and the median bias from -0.0137 to -0.0002, and DIA-NN 2.0
#     identifies 0.5 % and 0.2 % more precursors (runs 01, 02). They belong to the
#     shipped CCS model (ccs_model_fnv1a64): a tuned CCS model is not corrected.
#     Fit: scripts/eval/fit_mobility_correction.py.
name: timsTOF
aliases: [timsTOF Pro, timsTOF Pro 2, timsTOF SCP, timsTOF HT, timsTOF Ultra, timsTOF Ultra 2, timsTOF Flex]
model_instrument: timsTOF
ion_mobility: true
nce: 30
precursor_mz: [350, 1200]
fragment_mz: [200, 1800]
precursor_charges: [2, 3, 4]
mobility_correction:
  ccs_model_fnv1a64: c26eb20995b991f5
  intercept: 0.0237      # charges without a line of their own (fitted on 2+ to 4+ together)
  slope: 0.9894
  by_charge:
    2: {intercept: 0.0370, slope: 0.9757}
    3: {intercept: -0.0248, slope: 1.0440}
    4: {intercept: -0.0349, slope: 1.0561}
