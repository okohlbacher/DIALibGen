name: temporary AppImage crash diagnosis
on:
  push:
    branches: [release/0.11.0]
    paths: ['.github/workflows/appimage-diagnostic.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: packaging-diagnostics-linux-x64
          path: artifact
          run-id: 35531532404
          github-token: ${{ github.token }}
      - name: Capture the actual AppRun crash and dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdb xvfb xauth x11-utils dbus-x11 libwebkit2gtk-4.1-0
          mkdir diagnostics
          image=$(find artifact -name '*.AppImage' -type f)
          test -n "$image"
          chmod +x "$image"
          "$image" --appimage-extract > diagnostics/extraction.log
          cp squashfs-root/AppRun diagnostics/AppRun
          find squashfs-root -path '*apprun-hooks*' -type f -exec cp {} diagnostics/ \;
          for library in libglib-2.0.so.0 libgobject-2.0.so.0 libgio-2.0.so.0; do
            sha256sum "squashfs-root/usr/lib/$library" "/usr/lib/x86_64-linux-gnu/$library"
            readelf -n "squashfs-root/usr/lib/$library"
          done | tee diagnostics/glib-origins.log
          mv squashfs-root/usr/bin/dialibgen-gui squashfs-root/usr/bin/dialibgen-gui.real
          cat > squashfs-root/usr/bin/dialibgen-gui <<'PY'
          #!/usr/bin/python3
          import os
          from pathlib import Path
          env = os.environ.copy()
          args = ['/usr/bin/gdb', '--batch', '-ex', 'set pagination off', '-ex', 'set debuginfod enabled off']
          for key in ('LD_LIBRARY_PATH', 'LD_PRELOAD'):
              value = env.pop(key, '')
              if value:
                  args += ['-ex', f'set environment {key} {value}']
          args += ['-ex', 'run', '-ex', 'thread apply all bt', '-ex', 'info sharedlibrary', '--args', str(Path(__file__).with_suffix('.real'))]
          os.execve(args[0], args, env)
          PY
          chmod +x squashfs-root/usr/bin/dialibgen-gui
          test_home=$(mktemp -d)
          env -i PATH=/usr/bin:/bin HOME="$test_home" XDG_RUNTIME_DIR="$test_home" LANG=C.UTF-8 GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            timeout 90 xvfb-run -a dbus-run-session -- squashfs-root/AppRun > diagnostics/gdb.log 2>&1 || true
          mv squashfs-root/usr/bin/dialibgen-gui.real squashfs-root/usr/bin/dialibgen-gui
          # Isolate the suspected mixed GLib closure in this disposable copy.
          cp /usr/lib/x86_64-linux-gnu/libglib-2.0.so.0 squashfs-root/usr/lib/libglib-2.0.so.0
          mkdir diagnostics/system-glib
          env -i PATH=/usr/bin:/bin HOME="$test_home" XDG_RUNTIME_DIR="$test_home" LANG=C.UTF-8 GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a dbus-run-session -- python3 .github/linux-desktop-smoke.py \
              --launch "$PWD/squashfs-root/AppRun" --output "$PWD/diagnostics/system-glib" > diagnostics/system-glib-session.log 2>&1 || true
          cat diagnostics/gdb.log
          cat diagnostics/system-glib-session.log
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: appimage-crash-diagnosis
          path: diagnostics
