name: build

# Linux x64/arm64 and macOS x64/arm64, tests included.
#
# OpenMS comes from bioconda, installed in seconds. Windows is a separate
# workflow (windows.yml) for the unrelated reason that bioconda has no win-64
# package and OpenMS has to be built from source there.
#
# The gates that matter are at the END, against the INSTALLED tree rather than
# the build tree: a tool that links OpenMS but is not part of it gets OpenMS's
# defaults for its version, its update check and its data lookup, and all three
# are wrong for it. Every one of those has shipped past a green pipeline in a
# sibling project, found only by installing the artefact and typing a command.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # gui_dry_run exists because every desktop-app step below runs ONLY on a v*
  # tag, so its first execution would otherwise be a real release -- the one run
  # where a mistake is expensive, and one that cannot be repaired by fixing main
  # (a tag build reruns against the tag's tree). Dispatch with the switch on to
  # build the app without cutting a tag; nothing is uploaded to a release in
  # that mode, the bundle comes back as a workflow artifact instead.
  workflow_dispatch:
    inputs:
      gui_dry_run:
        description: 'Build the desktop app without cutting a tag'
        type: boolean
        default: false

concurrency:
  # A dispatch gets its OWN group. Sharing one with the branch means the next
  # push to main cancels a dry run someone is watching -- and, on a leg that
  # builds OpenMS, poisons the build cache mid-write.
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  macos-startup:
    if: github.event_name == 'workflow_dispatch' && inputs.gui_dry_run
    uses: ./.github/workflows/macos-startup.yml
    permissions:
      actions: read
      contents: read

  macos-candidate-startup:
    needs: build
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.gui_dry_run))
    uses: ./.github/workflows/macos-startup.yml
    with:
      candidate_run_id: ${{ format('{0}', github.run_id) }}
    permissions:
      actions: read
      contents: read

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # write, not the default: needed only by the tag-triggered release upload.
    # Safe on pull_request runs, including from forks -- GitHub issues a
    # read-only token for those regardless of what is declared here.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `extra` carries per-platform conda packages on top of the shared
          # set. macOS asks for llvm-openmp explicitly because Apple's clang
          # ships no OpenMP runtime; on Linux OpenMP comes from the gcc
          # toolchain and adding llvm-openmp risks clashing with libgomp.
          - { name: linux-x64,   runner: ubuntu-24.04,     extra: "libtorch=2.10.0=cpu_generic* libblas=*=*openblas", wheel: false }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, extra: "libblas=*=*openblas", wheel: true }
          - { name: macos-arm64, runner: macos-14,         extra: "llvm-openmp libtorch=2.10.0=cpu*", wheel: false }
          - { name: macos-x64,   runner: macos-15-intel,   extra: "llvm-openmp libtorch=2.10.0=cpu_generic* libblas=*=*openblas", wheel: false }

    steps:
      - uses: actions/checkout@v5

      # libboost-devel and qt6-main are dependencies OpenMSConfig.cmake needs
      # but the openms package does not pull in:
      #   libboost-devel  OpenMS/config.h is public and #includes
      #                   <boost/current_function.hpp>, so every downstream
      #                   translation unit needs Boost headers
      #   qt6-main        OpenMSConfig.cmake does find_dependency(Qt6)
      #
      # python/numpy/pyarrow/onnxruntime are for the TESTS, not the tool: the
      # C++ encoder is checked against an independent Python reference written
      # from the same spec but from different inputs, so agreement is evidence
      # the spec was implemented rather than that one copied the other. Without
      # them those tests do not fail -- they are simply never added, which is
      # the quiet way a test suite shrinks.
      #
      # libarrow is deliberately NOT pinned: openms pins it itself, and this
      # project is built against whatever that resolves to. That is the point of
      # having dropped the Arrow >= 23 floor to the 19 the code actually needs.
      #
      # create-args is a FOLDED scalar: every line is joined into one command
      # line, so a `#` comment inside it becomes a literal argument. All prose
      # belongs up here.
      - name: Install OpenMS, ONNX Runtime and the toolchain
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: dialibgen
          create-args: >-
            openms=3.5.0
            onnxruntime-cpp
            libparquet
            libarrow-dataset
            libarrow-acero
            nlohmann_json
            xerces-c
            libsvm
            eigen
            zlib
            bzip2
            libzip
            hdf5
            libcurl
            libboost-devel
            glpk
            coin-or-cbc
            coin-or-utils
            qt6-main
            cmake
            ninja
            cxx-compiler
            python
            numpy
            pyarrow
            onnxruntime
            ${{ matrix.extra }}
          condarc: |
            channels:
              - conda-forge
              - bioconda
          init-shell: bash
          cache-environment: true

      # Use the official ARM CPU wheel's C++ SDK outside the conda solve.
      # Parity and optimizer tests below must pass before this can be released.
      # The other legs retain the tested OpenBLAS builds (no MKL dispatch libs).
      - name: Restore the ARM libtorch SDK
        if: matrix.wheel
        id: torch-cache
        uses: actions/cache@v4
        with:
          path: libtorch-sdk
          key: libtorch-cpu-2.14.0-linux-arm64-08894195-v1

      - name: Extract the ARM libtorch SDK
        if: matrix.wheel && steps.torch-cache.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: python .github/fetch-libtorch.py linux-arm64 libtorch-sdk

      - name: Locate libtorch
        shell: bash -el {0}
        run: |
          set -euo pipefail
          if [ "${{ matrix.wheel }}" = true ]; then
            torch_root="$PWD/libtorch-sdk"
          else
            torch_root="$CONDA_PREFIX"
          fi
          test -f "$torch_root/share/cmake/Torch/TorchConfig.cmake"
          {
            echo "TORCH_ROOT=$torch_root"
            echo "TORCH_DIR=$torch_root/share/cmake/Torch"
          } >> "$GITHUB_ENV"
          # Use one libgomp.so.1 across OpenMS and the ARM SDK. Both have the
          # ordinary SONAME, so conda's toolchain runtime wins consistently.
          echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib:$torch_root/lib" >> "$GITHUB_ENV"

      # Pinned stock models are required for prediction and training tests.
      - name: Restore the PeptDeep models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: models
          key: peptdeep-models-ccs41816f32-ms24141ea23-rt3f3b847e

      - name: Fetch the PeptDeep models
        if: steps.cache-models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          fetch() {
            curl -fsSL --retry 3 -o "models/$1" "http://archive.openms.de/openms/models/$1"
            echo "$2  models/$1" | shasum -a 256 -c -
          }
          # OpenMS lists the files as ccs, ms2, rt and the hashes in that same
          # order; pairing them by eye got rt and ccs swapped, and the check
          # below is the only reason that was noticed rather than shipped.
          fetch peptdeep_ccs_dynamic.onnx 41816f325cdd838897b7e7dcaf291da5d4d3903a1532fc5dc9db7e0725015801
          fetch peptdeep_ms2_dynamic.onnx 4141ea233d663b6f5b98ad80b8923ee685dae5cfdbe12243e2e30cd9c44ecf00
          fetch peptdeep_rt_dynamic.onnx  3f3b847ea37a9333ac163409f3d4b343d021471548091c61aed6cfa398ce62fd

      - name: Configure
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # QT_HOST_PATH: conda-forge's Qt6 for aarch64 and osx-arm64 is marked
          # as a cross-compiled Qt, so Qt6Config.cmake refuses to load without a
          # host Qt. This build is native, so the same prefix IS the host Qt.
          # x64 is unaffected, which is why it only shows up on the ARM legs.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DQT_HOST_PATH="$CONDA_PREFIX" \
            -DODIA_MODEL_DIR="$PWD/models" \
            -DDIALIBGEN_BUILD_FINETUNE=ON \
            -DTorch_DIR="$TORCH_DIR" \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage"

      - name: Build
        shell: bash -el {0}
        run: cmake --build build -j 2

      - name: Test
        shell: bash -el {0}
        run: |
          set -euo pipefail
          ctest --test-dir build -N > registered-tests.txt
          for name in tune_parity tune_e2e; do
            grep -Eq "[ :]+$name$" registered-tests.txt \
              || { echo "::error::$name is not registered; this release must include training"; exit 1; }
          done
          ctest --test-dir build --output-on-failure --output-junit "$PWD/build/ctest.xml"
          python - <<'PYTEST'
          import xml.etree.ElementTree as ET
          tests = {case.get("name"): case for case in ET.parse("build/ctest.xml").iter("testcase")}
          for name in ("tune_parity", "tune_e2e"):
              assert name in tests and tests[name].find("skipped") is None, f"{name} must pass, not skip"
          PYTEST
          # A test that is never ADDED does not fail -- it disappears. The
          # prediction tier is gated on the models being present, which is
          # exactly the condition that used to be false everywhere, so assert
          # the gate opened rather than trusting a green run.
          ctest --test-dir build -N | grep -q "peptdeep_predictions_match_reference" \
            || { echo "::error::the prediction tests were not registered -- models missing?"; exit 1; }
          ctest --test-dir build -N | grep -q "e2e" \
            || { echo "::error::the e2e test was not registered"; exit 1; }

      - name: Diagnose an ARM training failure
        if: failure() && !cancelled() && matrix.wheel
        shell: bash -el {0}
        run: |
          # Diagnostics never replace or relax the failed training gates above.
          timeout 90s bash <<'ARM_DIAG' || true
          set +e
          parity="$PWD/build/test/refinement/dialibgen_tune_parity"
          ldd "$parity"
          cat > /tmp/dialibgen-arm-lstm.cpp <<'CPP'
          #include <torch/torch.h>
          #include <iostream>
          int main(int argc, char**)
          {
            torch::set_num_threads(1);
            if (argc > 1) { at::globalContext().setUserEnabledMkldnn(false); }
            torch::nn::LSTM model(torch::nn::LSTMOptions(140, 128).num_layers(2).bidirectional(true).batch_first(true));
            auto state = std::make_tuple(torch::zeros({4, 1, 128}), torch::zeros({4, 1, 128}));
            std::cout << "LSTM forward" << std::endl;
            auto output = std::get<0>(model->forward(torch::randn({1, 8, 140}), state));
            std::cout << "LSTM backward" << std::endl;
            output.sum().backward();
            std::cout << "LSTM passed" << std::endl;
          }
          CPP
          "$CXX" -std=c++23 -O0 /tmp/dialibgen-arm-lstm.cpp \
            -I "$TORCH_ROOT/include" -I "$TORCH_ROOT/include/torch/csrc/api/include" \
            -L "$TORCH_ROOT/lib" -Wl,-rpath,"$TORCH_ROOT/lib" \
            -ltorch -ltorch_cpu -lc10 -o /tmp/dialibgen-arm-lstm
          if [ -x /tmp/dialibgen-arm-lstm ]; then
            ldd /tmp/dialibgen-arm-lstm
            for mode in default no-mkldnn; do
              arg=(); [ "$mode" = default ] || arg=(no-mkldnn)
              echo "Torch-only: $mode, conda first"
              timeout 8s /tmp/dialibgen-arm-lstm "${arg[@]}"; echo "exit=$?"
              echo "Torch-only: $mode, SDK first"
              LD_LIBRARY_PATH="$TORCH_ROOT/lib:$CONDA_PREFIX/lib" timeout 8s /tmp/dialibgen-arm-lstm "${arg[@]}"; echo "exit=$?"
              echo "ORT preloaded: $mode"
              LD_PRELOAD="$CONDA_PREFIX/lib/libonnxruntime.so" timeout 8s /tmp/dialibgen-arm-lstm "${arg[@]}"; echo "exit=$?"
            done
          fi
          if command -v gdb >/dev/null; then
            timeout 20s gdb -batch -ex run -ex 'thread apply all bt 12' -ex 'info sharedlibrary' \
              --args "$parity" "$PWD/models/peptdeep_rt_dynamic.onnx" "$PWD/models/peptdeep_ccs_dynamic.onnx"
          fi
          ARM_DIAG

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: tests-${{ matrix.name }}
          path: build/Testing/Temporary/LastTest.log

      - name: Install
        shell: bash -el {0}
        run: cmake --install build

      # ---------------------------------------------------------------------
      # The standalone-tool gates, against the INSTALLED tree.
      #
      # `env -i` is the load-bearing part: a runner that still has the build
      # tree on PATH, or OPENMS_DATA_PATH set, will happily pass a binary that
      # cannot stand on its own. OPENMS_DATA_PATH and the conda lib path are
      # passed back explicitly -- naming them is the difference between "the
      # binary needs these" and "the binary happened to inherit these".
      # ---------------------------------------------------------------------
      - name: Verify installed CMake libraries
        shell: bash -el {0}
        run: |
          cmake -S test/consumer -B consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/stage;$CONDA_PREFIX" \
            -DQT_HOST_PATH="$CONDA_PREFIX" -DTorch_DIR="$TORCH_DIR"
          cmake --build consumer -j 2
          ctest --test-dir consumer --output-on-failure

      - name: The installed binary stands on its own
        shell: bash -el {0}
        run: |
          set -euo pipefail
          BIN="$PWD/stage/bin/DIALibGen"
          test -x "$BIN" || { echo "::error::no installed binary at $BIN"; exit 1; }

          # The data tables must be INSIDE the install, at the path the tool
          # searches. Before this they resolved to an absolute path in the
          # source tree, so an installed or relocated binary found nothing.
          test -s "$PWD/stage/share/DIALibGen/irt_standards.tsv" \
            || { echo "::error::the iRT standards are not in the install tree"; exit 1; }

          # The three models must be IN the install tree. They are bundled from
          # 0.10.1, and an install that silently lacks them is an install that
          # cannot predict anything.
          for m in peptdeep_rt_dynamic.onnx peptdeep_ms2_dynamic.onnx peptdeep_ccs_dynamic.onnx; do
            test -s "$PWD/stage/share/DIALibGen/models/$m" \
              || { echo "::error::$m is not in the install tree"; exit 1; }
          done

          export OPENMS_DATA_PATH="$CONDA_PREFIX/share/OpenMS"
          export DYLD_FALLBACK_LIBRARY_PATH="$CONDA_PREFIX/lib"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$TORCH_ROOT/lib"
          bash test/standalone_test.sh "$BIN" \
            "$(sed -n 's/^  VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" \
            example/proteins.fasta
          bash test/write_ctd_test.sh "$BIN" || [ $? -eq 77 ]

      # End to end, against the INSTALLED binary and the real models: a FASTA in,
      # a library out, in both formats. Everything above proves the tool starts
      # and refuses bad input; this is the only step that proves it predicts.
      - name: Build a real library
        shell: bash -el {0}
        run: |
          set -euo pipefail
          export OPENMS_DATA_PATH="$CONDA_PREFIX/share/OpenMS"
          # No DIALIBGEN_MODEL_DIR: the installed tree carries the models now, and
          # the point of this step is that the tool finds them by itself.
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$TORCH_ROOT/lib"
          export DYLD_FALLBACK_LIBRARY_PATH="$CONDA_PREFIX/lib"
          BIN="$PWD/stage/bin/DIALibGen"

          "$BIN" -in example/proteins.fasta -out out.parquet
          "$BIN" -in example/proteins.fasta -out out.tsv

          test -s out.parquet || { echo "::error::no Parquet library"; exit 1; }
          test -s out.tsv     || { echo "::error::no TSV library"; exit 1; }

          # A library with no rows is not a library, and a Parquet that does not
          # carry the recipe is the whole reason to prefer it over the TSV.
          python - <<'PY'
          import pyarrow.parquet as pq, json, sys
          f = pq.ParquetFile("out.parquet")
          n = f.metadata.num_rows
          if n == 0:
              sys.exit("::error::the Parquet library has no rows")
          md = f.schema_arrow.metadata or {}
          raw = md.get(b"odia.config_json")
          if not raw:
              sys.exit("::error::the Parquet library does not carry odia.config_json")
          cfg = json.loads(raw)
          for k in ("enzyme", "fixed_modifications", "schema_version"):
              if k not in cfg:
                  sys.exit(f"::error::the embedded recipe is missing {k!r}")
          # One row per PRECURSOR: the compact schema carries the fragments as
          # list columns, so this is not a transition count.
          print(f"library: {n} precursors, recipe embedded ({len(cfg)} keys)")
          PY

          # The TSV is the DIA-NN dialect: a header and at least one row.
          rows=$(wc -l < out.tsv)
          [ "$rows" -gt 1 ] || { echo "::error::the TSV library has no rows"; exit 1; }
          # The dotted spellings, which is what makes this the DIA-NN dialect
          # rather than merely a table -- see DIANNLibraryFile::Columns.
          for col in Precursor.Id Modified.Sequence Precursor.Mz Product.Mz \
                     Relative.Intensity Fragment.Type Protein.Group; do
            head -1 out.tsv | tr '\t' '\n' | grep -qxF "$col" \
              || { echo "::error::the TSV header has no $col column"; exit 1; }
          done
          echo "tsv: $((rows - 1)) rows"

      - name: Exercise all installed modes
        shell: bash -el {0}
        run: python .github/release-smoke.py stage/bin/DIALibGen --output smoke-installed

      # ---------------------------------------------------------------------
      # Release. Everything below runs on a v* tag, or on a dispatch with
      # gui_dry_run -- which is the only way any of it gets exercised before a
      # tag depends on it.
      # ---------------------------------------------------------------------
      - name: Decide whether to package
        id: pkg
        shell: bash
        run: |
          # event_name FIRST, and a dispatch never releases whatever ref it was
          # selected against. Testing the ref first meant that dispatching this
          # workflow with a TAG selected in the Actions UI took the release
          # branch -- so the run whose entire purpose is to touch no release
          # would have uploaded to the real one.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.gui_dry_run }}" = "true" ]; then
              echo "package=true" >> "$GITHUB_OUTPUT"
            else
              echo "package=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "package=true" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "package=false" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # macOS code signing and notarization. Entirely optional: with no
      # MACOS_CERTIFICATE_BASE64 secret every step here is skipped and the macOS
      # artefacts are ad-hoc signed exactly as they were, so forks and pull
      # requests -- which cannot read secrets at all -- keep building.
      #
      # The secret NAMES and the notarization route are BALL's and FASTag's, not
      # this repo's invention: one Developer ID Application certificate covers
      # every app on the team, and ~/Documents/Admin/Software Signing supplies
      # the same seven values to all three repos through its copy-secret.sh.
      # Diverging here would mean a second set of names for one identity.
      #
      # Why it matters: an unsigned payload installed by a package manager
      # carries a provenance record Gatekeeper refuses, clearing the quarantine
      # attribute does not remove it, and Homebrew 6 dropped --no-quarantine --
      # so the casks cannot work until this is on.
      # ---------------------------------------------------------------------
      - name: Decide whether to sign
        id: sign
        if: runner.os == 'macOS' && steps.pkg.outputs.package == 'true'
        shell: bash
        # Mapped into env and gated on a step OUTPUT below. `secrets.*` in an
        # `if:` is not merely ignored -- it makes the whole workflow invalid and
        # every push returns a 0-job startup_failure.
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          NOTARY: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_ID: ${{ secrets.MACOS_APPLE_ID }}
          NOTARY_TEAM: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CERT" ]; then
            echo "::notice::no MACOS_CERTIFICATE_BASE64 -- macOS artefacts stay ad-hoc signed"
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sign=true" >> "$GITHUB_OUTPUT"
          # ALL THREE, not the password alone. Deciding on one of them exported
          # the other two as set-but-empty to Tauri -- which is the exact trap
          # documented twenty lines below, reintroduced here.
          if [ -n "$NOTARY" ] && [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_TEAM" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            [ -z "$NOTARY" ] || echo "::warning::MACOS_NOTARY_PASSWORD is set but MACOS_APPLE_ID/MACOS_TEAM_ID are not"

            # Worth saying out loud: Gatekeeper refuses a signed-but-unnotarized
            # build exactly as it refuses an unsigned one, so this half-state
            # buys nothing.
            echo "::warning::signing without notarizing -- Gatekeeper still refuses these"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the Developer ID certificate
        if: steps.sign.outputs.sign == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          # The secret if it is there; otherwise generated, because it protects
          # only a keychain that lives for one job on a runner that is then
          # destroyed, and an empty password is worse than a random one.
          KCPW="${MACOS_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          echo "::add-mask::$KCPW"
          # An ephemeral keychain, never the runner's login keychain: that one is
          # locked, and importing into it waits on a prompt nobody can answer.
          KC="$RUNNER_TEMP/dialibgen-signing.keychain-db"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without the partition list codesign blocks on a GUI prompt and the
          # job sits there producing no output until the timeout.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KCPW" "$KC" > /dev/null
          keychains=()
          while IFS= read -r keychain; do keychains+=("$keychain"); done \
            < <(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          security list-keychain -d user -s "$KC" "${keychains[@]}"
          security default-keychain -d user -s "$KC"

          # Read back what was actually imported and hold the secret to it. A
          # MACOS_SIGNING_IDENTITY that disagrees with the certificate fails
          # later, inside codesign, with a message that names neither.
          IDENT=$(security find-identity -p codesigning -v "$KC" \
                    | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$IDENT" ] || {
            security find-identity -p codesigning -v "$KC"
            echo "::error::no Developer ID Application identity in the imported certificate"
            echo "::error::Apple Development and Apple Distribution certificates sit next to it in the portal and cannot sign for distribution outside the App Store"
            exit 1
          }
          if [ -n "$MACOS_SIGNING_IDENTITY" ] && [ "$MACOS_SIGNING_IDENTITY" != "$IDENT" ]; then
            echo "::error::MACOS_SIGNING_IDENTITY does not match the imported certificate ($IDENT)"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$IDENT" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "signing as: $IDENT"

          # Tauri's own variable names, exported HERE and only here -- that is
          # the whole point. Declaring them in the build step's `env:` instead
          # does not work: GitHub sets an absent secret to the EMPTY STRING,
          # which is still *set*, and Tauri tests presence rather than
          # emptiness. An unsigned build then tried to sign and died with
          # "failed to run command security import: failed to import keychain
          # certificate". This step runs only when there is a certificate, so
          # an unsigned build sees no such variables at all.
          #
          # The heredoc form because a base64 secret may arrive wrapped; the
          # delimiter cannot occur in base64, which has no underscore.
          {
            echo "APPLE_CERTIFICATE<<__ODIA_EOF__"
            printf '%s\n' "$MACOS_CERTIFICATE_BASE64"
            echo "__ODIA_EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=$MACOS_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENT"
            echo "KEYCHAIN_PASSWORD=$KCPW"
          } >> "$GITHUB_ENV"
          if [ -n "$MACOS_NOTARY_PASSWORD" ]; then
            {
              echo "APPLE_ID=$MACOS_APPLE_ID"
              echo "APPLE_PASSWORD=$MACOS_NOTARY_PASSWORD"
              echo "APPLE_TEAM_ID=$MACOS_TEAM_ID"
            } >> "$GITHUB_ENV"
          fi

      # The installed tree links libOpenMS, Arrow and onnxruntime out of the
      # conda prefix by ABSOLUTE path, so it runs on this runner and nowhere
      # else. Collecting the closure and rewriting the load paths to be relative
      # is what turns it into something a user can unpack.
      - name: Make the install tree portable
        if: steps.pkg.outputs.package == 'true'
        # Bounded on purpose: everything here is seconds of real work, so a
        # step that runs for twenty minutes is hung, not slow.
        timeout-minutes: 20
        shell: bash -el {0}
        run: |
          set -euo pipefail
          mkdir -p stage/lib
          # The tool resolves share/OpenMS through OPENMS_DATA_PATH or the
          # install prefix, and neither is where CMake thought it would be once
          # the tree moves -- so carry OpenMS's own data inside the bundle.
          mkdir -p stage/share/OpenMS
          cp -R "$CONDA_PREFIX/share/OpenMS/." stage/share/OpenMS/

          if [ "$RUNNER_OS" = "macOS" ]; then
            # An explicit otool/install_name_tool walk, NOT dylibbundler.
            # dylibbundler failed twice here in two different ways: it hung for
            # forty minutes on an interactive prompt, and with stdin closed it
            # spun forever printing "libOpenMS.dylib does not exist. Try again"
            # -- it cannot resolve the @rpath install names a conda build uses
            # and asks a human where they are. Fifteen lines that resolve
            # @rpath against a known prefix are easier to reason about than a
            # tool whose failure mode is a question.
            copy_closure() {
              otool -L "$1" | tail -n +2 | awk '{print $1}' | while read -r dep; do
                case "$dep" in
                  /usr/lib/*|/System/*) continue ;;
                esac
                base=$(basename "$dep")
                # @rpath/@loader_path/@executable_path all resolve to the conda
                # prefix here, which is where the build actually linked from.
                src="$dep"
                case "$dep" in
                  @*)
                    src="$CONDA_PREFIX/lib/$base"
                    [ -f "$src" ] || src="$TORCH_ROOT/lib/$base"
                    ;;
                esac
                [ -f "$src" ] || { echo "::error::unresolved in $1: $dep"; exit 1; }
                [ -f "stage/lib/$base" ] || cp "$src" "stage/lib/$base"
              done
            }
            copy_closure stage/bin/DIALibGen
            prev=0
            for _ in 1 2 3 4 5 6 7 8; do
              n=$(find stage/lib -type f | wc -l)
              [ "$n" -eq "$prev" ] && break
              prev=$n
              for dy in stage/lib/*.dylib; do copy_closure "$dy"; done
            done

            # Rewrite every load command to the bundle-relative path, and give
            # each library an id to match.
            retarget() {
              otool -L "$1" | tail -n +2 | awk '{print $1}' | while read -r dep; do
                case "$dep" in
                  /usr/lib/*|/System/*) continue ;;
                esac
                base=$(basename "$dep")
                [ -f "stage/lib/$base" ] || continue
                install_name_tool -change "$dep" "@executable_path/../lib/$base" "$1"
              done
            }
            retarget stage/bin/DIALibGen
            for dy in stage/lib/*.dylib; do
              install_name_tool -id "@executable_path/../lib/$(basename "$dy")" "$dy"
              retarget "$dy"
            done
            # Editing a Mach-O invalidates its signature, and arm64 macOS
            # REFUSES to load an invalidly-signed one -- so an ad-hoc
            # re-signature is not optional cleanup, it is what makes the
            # bundle runnable at all.
            #
            # With a Developer ID imported this is also the real signature: the
            # hardened runtime (--options runtime) and a timestamp are both
            # required for notarization, and every Mach-O in the payload needs
            # them, not just the executable.
            if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
              sign() { codesign --force --timestamp --options runtime \
                         --keychain "$MACOS_KEYCHAIN" --sign "$MACOS_SIGN_IDENTITY" "$@"; }
            else
              sign() { codesign --force --sign - "$@"; }
            fi
            for dy in stage/lib/*.dylib; do sign "$dy"; done
            sign stage/bin/DIALibGen
            codesign --verify --strict --verbose=2 stage/bin/DIALibGen
          else
            # patchelf plus a manual closure: ldd names everything the loader
            # would open, minus the system libraries a distro certainly has.
            #
            # LD_LIBRARY_PATH is the load-bearing line. A conda library carries
            # an RPATH like $ORIGIN/../lib, which resolves inside the conda
            # prefix and NOT from stage/lib -- so ldd on a COPY reports its
            # dependencies as "not found", the `=> /` filter drops them
            # silently, and the closure stops one level in. That shipped a
            # bundle missing libblas.so.3, and the only symptom was the
            # portability check below.
            export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$TORCH_ROOT/lib"
            copy_closure() {
              local missing
              missing=$(ldd "$1" | awk '/not found/{print $1}')
              [ -z "$missing" ] || { echo "::error::unresolved in $1: $missing"; exit 1; }
              ldd "$1" | awk '/=> \//{print $3}' | while read -r so; do
                case "$so" in
                  /lib/*|/lib64/*|/usr/lib/*|*/ld-linux*) continue ;;
                esac
                cp -n "$so" stage/lib/ 2>/dev/null || true
              done
            }
            copy_closure stage/bin/DIALibGen
            # Iterate to a fixed point rather than a guessed depth: each round
            # can pull in libraries whose own dependencies are not yet present.
            prev=0
            for _ in 1 2 3 4 5 6 7 8; do
              n=$(find stage/lib -type f | wc -l)
              [ "$n" -eq "$prev" ] && break
              prev=$n
              for so in stage/lib/*.so*; do copy_closure "$so"; done
            done
            # shellcheck disable=SC2016
            patchelf --set-rpath '$ORIGIN/../lib' stage/bin/DIALibGen
            # shellcheck disable=SC2016
            for so in stage/lib/*.so*; do patchelf --set-rpath '$ORIGIN' "$so" || true; done
          fi

          # The load-bearing check, and the reason this step is not decorative:
          # NOTHING from the build environment on the path. A bundle verified
          # with the conda prefix still visible proves only that conda is there.
          env -i HOME="$HOME" "$PWD/stage/bin/DIALibGen" --help > portable.txt 2>&1 \
            || { echo "::error::the staged bundle is not portable"; cat portable.txt; exit 1; }
          want=$(sed -n 's/^  VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          grep -q "^Version: $want" portable.txt \
            || { echo "::error::the portable bundle reports the wrong version"; exit 1; }
          test -s stage/share/DIALibGen/irt_standards.tsv
          test -s stage/share/DIALibGen/models/peptdeep_ms2_dynamic.onnx \
            || { echo "::error::the staged bundle carries no models"; exit 1; }
          # unimod.xml, not just the directory: that one file is the whole of
          # File::isOpenMSDataPath_, so this is the runtime test spelled here.
          test -s stage/share/OpenMS/CHEMISTRY/unimod.xml \
            || { echo "::error::the staged tree is not a valid OpenMS data path"; exit 1; }

          # --help loads neither ONNX Runtime nor Arrow and reads none of
          # OpenMS's data tables, so it separates a startable bundle from an
          # unstartable one and nothing more. Generate a real library from the
          # bare tree: that is the claim the archive actually makes.
          env -i HOME="$HOME" \
              "$PWD/stage/bin/DIALibGen" \
              -in example/proteins.fasta -out portable.tsv > portable-run.txt 2>&1 \
            || { echo "::error::the staged bundle cannot generate a library"; cat portable-run.txt; exit 1; }
          [ "$(wc -l < portable.tsv)" -gt 1 ] \
            || { echo "::error::the staged bundle produced an empty library"; exit 1; }
          echo "portable bundle ok: $(find stage/lib -name '*.so*' -o -name '*.dylib' | wc -l) libraries"

      # notarytool takes a .zip, a .dmg or a .pkg and not a .tar.gz, so the
      # staged tree is zipped for SUBMISSION only. That is not a workaround:
      # notarization registers the code-directory hash of each signed binary
      # with Apple, and the ticket then applies to those binaries in whatever
      # container they arrive in.
      #
      # What a .tar.gz cannot have is a STAPLED ticket, so the first run of a
      # quarantined copy checks with Apple over the network. The .dmg below is
      # stapled and does not -- the one behavioural difference between the two
      # downloads.
      - name: Exercise all relocated modes in a bare environment
        if: steps.pkg.outputs.package == 'true'
        shell: bash -el {0}
        run: |
          python .github/release-smoke.py stage/bin/DIALibGen --bare --output smoke-portable
          if find stage/lib -iname '*python*' | grep -q .; then
            echo "::error::the C++ release unexpectedly depends on Python"; exit 1
          fi

      - name: Notarize the CLI
        if: steps.sign.outputs.notarize == 'true'
        timeout-minutes: 60
        shell: bash
        env:
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent stage "$RUNNER_TEMP/cli.zip"
          # Through .github/notarize.sh, which fetches `notarytool log` when
          # Apple says Invalid -- otherwise a rejection is a submission id and
          # nothing else, and the reason costs another submission to find.
          bash .github/notarize.sh "$RUNNER_TEMP/cli.zip"

      - name: Package the CLI
        if: steps.pkg.outputs.package == 'true'
        shell: bash -el {0}
        run: tar -C stage -czf "DIALibGen-${{ matrix.name }}.tar.gz" .

      # The desktop app, with that same portable tree as its bundled resources.
      # Staged BEFORE the Tauri build, because tauri copies resources/ during
      # the build: doing it afterwards produces an app whose resources are the
      # empty skeleton, and every check that looks at the source tree passes.
      # `bash`, NOT `bash -el`: the micromamba environment must not be active
      # here, and its bin directory is scrubbed from PATH below for the same
      # reason. cargo resolves its linker by PATH name, so with the conda
      # toolchain in front it links with aarch64-conda-linux-gnu-ld -- which
      # cannot resolve the SYSTEM webkit2gtk this app links against, and
      # produces several hundred lines of undefined references to epoxy, gst
      # and icu. Nothing in this step wants conda: it copies an already-built
      # tree and runs node and cargo.
      - name: Build the desktop app
        if: steps.pkg.outputs.package == 'true'
        # Tauri notarizes the .app inside this step, so it inherits Apple's queue
        # and was the only long step here with no bound at all -- a stuck
        # submission would have held a runner for the job's six-hour default.
        timeout-minutes: 90
        shell: bash
        # No `env:` block here on purpose -- the APPLE_* variables Tauri reads
        # are exported by the certificate-import step above, which runs only
        # when there is something to sign with. See the note there.
        #
        # Tauri staples the .app, NOT the .dmg -- it only signs the image. The
        # image is notarized and stapled in a later step; `stapler validate` on
        # a Tauri .dmg fails, which reads as a broken build and is not one.
        run: |
          set -euo pipefail
          PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v micromamba | paste -sd: -)
          export PATH
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            # xdg-utils and file are for the BUNDLER, not the build: Tauri's
            # AppImage step shells out to xdg-open and dies with
            # "xdg-open binary not found". The x64 runner image happens to
            # carry them and the arm64 one does not, which is the only reason
            # this was an arm64-only failure.
            sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
              librsvg2-dev patchelf libgtk-3-dev xdg-utils file \
              desktop-file-utils
          fi
          rm -rf gui/src-tauri/resources/dialibgen
          mkdir -p gui/src-tauri/resources/dialibgen
          cp -R stage/. gui/src-tauri/resources/dialibgen/
          test -x gui/src-tauri/resources/dialibgen/bin/DIALibGen \
            || { echo "::error::the CLI was not staged into the app's resources"; exit 1; }
          cd gui
          npm ci
          # bundle_dmg.sh's own stderr is SWALLOWED by tauri unless --verbose is
          # on, so its failure arrives as "error running bundle_dmg.sh" and
          # nothing else -- which is how macos-x64 failed with no diagnosable
          # cause while macos-arm64 built the same commit fine.
          #
          # One retry, verbose, after detaching any half-attached image: if this
          # is the transient hdiutil/Finder failure the macOS runners are known
          # for, the release survives it; if it is real, the reason is in the log
          # instead of being lost a second time.
          npm run tauri build || {
            echo "::warning::tauri build failed -- retrying once, verbosely"
            if [ "$RUNNER_OS" = "macOS" ]; then
              hdiutil info | awk '/\/Volumes\/DIALibGen/{print $1}' \
                | xargs -r -n1 hdiutil detach -force 2>/dev/null || true
            fi
            npm run tauri build -- --verbose
          }

      # Renamed to FIXED names. Tauri spells them with its own version and
      # architecture (DIALibGen_0.2.0_aarch64.dmg), which makes every
      # URL that points at them -- the README's, and the Homebrew cask's --
      # depend on Tauri's naming rather than on ours. A cask pins a digest to a
      # URL, so a name that moves is a cask that 404s.
      - name: Collect the desktop bundles
        if: steps.pkg.outputs.package == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-bundles
          n=0
          while IFS= read -r f; do
            ext="${f##*.}"
            cp "$f" "dist-bundles/DIALibGen-gui-${{ matrix.name }}.$ext"
            n=$((n + 1))
          done < <(find gui/src-tauri/target/release/bundle \
                     \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -type f)
          ls -la dist-bundles
          # A bundle step that produces nothing must fail here, not go unnoticed
          # until a README link 404s.
          [ "$n" -gt 0 ] \
            || { echo "::error::the desktop build produced no installer"; exit 1; }

      # Tauri notarized and stapled the .app INSIDE the image; the image itself
      # it only signed. Without this the .dmg carries no ticket of its own, so
      # Gatekeeper checks it online -- which is the difference between a
      # download that works on a train and one that does not.
      - name: Notarize and staple the disk image
        if: steps.sign.outputs.notarize == 'true'
        timeout-minutes: 60
        shell: bash
        env:
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="dist-bundles/DIALibGen-gui-${{ matrix.name }}.dmg"
          test -f "$DMG" || { echo "::error::no $DMG to notarize"; exit 1; }
          # --force because Tauri already signed it: the rename this repo does
          # afterwards does not invalidate that, but re-signing costs nothing
          # and makes the identity on the shipped name certain.
          codesign --force --timestamp --keychain "$MACOS_KEYCHAIN" \
            --sign "$MACOS_SIGN_IDENTITY" "$DMG"
          bash .github/notarize.sh "$DMG"
          xcrun stapler staple "$DMG"

      # Gatekeeper's own verdict, not codesign's. codesign says the signature is
      # intact; spctl says the system would actually open it, and only the
      # second is the question a cask install turns on.
      - name: The signed artefacts are what they claim to be
        if: steps.sign.outputs.notarize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DMG="dist-bundles/DIALibGen-gui-${{ matrix.name }}.dmg"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"
          xcrun stapler validate "$DMG"
          codesign --verify --strict --verbose=2 stage/bin/DIALibGen

          # The .app's OWN ticket, which is a separate claim from the image's:
          # a user drags the app OUT of the image, and the image's ticket does
          # not travel with it. Tauri runs `stapler staple` on the bundle and
          # DISCARDS the exit status, so a ticket that failed to attach -- most
          # often error 65, the ticket not yet propagated moments after an
          # Accept -- leaves the build green and the app refused offline.
          #
          # Checked against bundle/macos, which is the bundle the .dmg was built
          # FROM, after Tauri stapled it. Nothing can repair it here: the image
          # already contains whatever was stapled, so this fails the run and a
          # re-run picks up the propagated ticket.
          shopt -s nullglob
          apps=(gui/src-tauri/target/release/bundle/macos/*.app)
          [ "${#apps[@]}" -gt 0 ] \
            || { echo "::error::no .app bundle to validate"; exit 1; }
          xcrun stapler validate "${apps[0]}" || {
            echo "::error::the .app carries no notarization ticket -- Tauri's staple failed silently"
            echo "::error::re-run this job; the ticket is usually just not propagated yet"
            exit 1
          }

      - uses: actions/upload-artifact@v5
        if: steps.pkg.outputs.package == 'true'
        with:
          name: bundles-${{ matrix.name }}
          path: |
            DIALibGen-${{ matrix.name }}.tar.gz
            dist-bundles/*

      - name: Attach to the release
        if: steps.pkg.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            DIALibGen-${{ matrix.name }}.tar.gz
            dist-bundles/*
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: |
            smoke-installed/*.log
            smoke-installed/**/*.tune.json
            smoke-portable/*.log
            smoke-portable/**/*.tune.json

      # Last, because everything above that needs the identity has run, and
      # always(), so an earlier failure still takes the keychain with it.
      - name: Delete the signing keychain
        if: always() && steps.sign.outputs.sign == 'true'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/dialibgen-signing.keychain-db" || true

  # A release whose README links 404 is worse than a missing release: the links
  # are written for the asset names that were MEANT to be published, not the
  # ones that were. This asserts the four this workflow is responsible for are
  # actually on the tag. (windows-x64 comes from windows.yml and asserts its
  # own, because a cross-workflow wait would be a race either way.)
  release-complete:
    needs: build
    # always(), because `needs: build` alone makes this SKIPPED exactly when a
    # build leg fails -- which is the one case it exists for. fail-fast is off,
    # so the surviving legs still publish their assets and the release goes
    # public missing whatever the failed leg owed it.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Assert this workflow's assets are on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          have=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                   --json assets -q '.assets[].name')
          echo "$have"
          missing=0
          for n in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            printf '%s' "$have" | grep -qx "DIALibGen-$n.tar.gz" \
              || { echo "::error::no CLI tarball for $n on $tag"; missing=1; }
          done
          # Named exactly, not by extension: the Homebrew cask and the README
          # both point at these spellings, so "some dmg exists" is not the
          # property that matters.
          for n in macos-x64 macos-arm64; do
            printf '%s' "$have" | grep -qx "DIALibGen-gui-$n.dmg" \
              || { echo "::error::no desktop .dmg for $n on $tag"; missing=1; }
          done
          printf '%s' "$have" | grep -q '^DIALibGen-gui-linux-.*\.\(AppImage\|deb\)$' \
            || { echo "::error::no Linux desktop bundle on $tag"; missing=1; }
          exit $missing

  # The desktop GUI's own checks. They need no OpenMS and no models, so they run
  # on all three OSes in a couple of minutes and catch the frontend regressions
  # the C++ matrix never would.
  gui:
    name: gui-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
        working-directory: gui
      - run: npm run typecheck
        working-directory: gui
      - run: npm test
        working-directory: gui
      - run: npm run build
        working-directory: gui

      # The Rust side: its unit tests cover the trust boundary (which config
      # keys may reach the CLI, and how a dash-leading path is defanged), and
      # clippy is denied warnings so a lint does not accumulate until a release.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Tauri needs the system webview and its build dependencies on Linux.
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - run: cargo test
        working-directory: gui/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: gui/src-tauri
