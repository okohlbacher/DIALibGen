<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="DIALibGen" description="Predict DIA spectral libraries from a FASTA and adapt them to a run. Uses all physical cores unless -threads is given. --help -mode &lt;mode&gt; shows one mode&apos;s options. Docs: https://github.com/okohlbacher/DIALibGen/blob/main/docs/usage.md">
    <ITEM name="version" value="0.12.1" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;DIALibGen&apos;">
      <ITEM name="mode" value="generate" type="string" description="Generate: FASTA to library; refine: write a run&apos;s observed RT (and 1/K0) into a library; tune: fine-tune RT (and CCS) on a run and re-predict the whole library; convert: change the format; prepare (macOS): precompile the GPU model. Without -mode: generate for a FASTA, convert for a library." required="false" advanced="false" restrictions="generate,refine,tune,convert,prepare" />
      <ITEM name="in" value="" type="input-file" description="Protein FASTA (generate) or spectral library (refine, tune, convert)" required="false" advanced="false" supported_formats="*.fasta,*.parquet,*.tsv" />
      <ITEM name="out" value="" type="output-file" description="Library to write: .tsv for DIA-NN; .pqp for OpenSWATH (add -generation:decoys); .parquet for DIALibGen (DIA-NN cannot read it). Other layouts: -out_format" required="false" advanced="false" supported_formats="*.parquet,*.tsv,*.pqp" />
      <ITEM name="out_format" value="auto" type="string" description="Layout of -out. auto: by extension (.parquet dialibgen_parquet, .tsv diann_tsv, .pqp openswath_pqp). diann2_parquet (.parquet): DIA-NN 2.0&apos;s own Parquet library layout. openswath_tsv (.tsv): OpenSWATH&apos;s assay TSV, as TargetedFileConverter reads it" required="false" advanced="true" restrictions="auto,dialibgen_parquet,diann_tsv,diann2_parquet,openswath_pqp,openswath_tsv" />
      <ITEM name="config" value="" type="input-file" description="JSON recipe for the mode (-write_config writes one); options on the command line or in the INI override it" required="false" advanced="false" supported_formats="*.json" />
      <ITEM name="write_config" value="" type="output-file" description="Write the mode&apos;s effective recipe (JSON) and exit" required="false" advanced="true" supported_formats="*.json" />
      <ITEM name="models" value="" type="string" description="Directory of the stock peptdeep_{rt,ms2,ccs}_dynamic.onnx models for generate, -tune and -run. Default: $DIALIBGEN_MODEL_DIR, else the bundled models. -generation:{rt,ms2,ccs}_model name single files" required="false" advanced="true" />
      <ITEM name="irt_standards" value="" type="input-file" description="Generate: iRT standards for -generation:irt_rescale true; default: the bundled table" required="false" advanced="true" supported_formats="*.tsv" />
      <ITEM name="instrument_file" value="" type="input-file" description="Generate: the instrument&apos;s defaults (NCE, ion mobility, m/z windows, charges) from this YAML file. Otherwise one file per instrument from $DIALIBGEN_INSTRUMENT_DIR, then the user&apos;s DIALibGen/instruments directory (~/.config, ~/Library/Application Support or %APPDATA%), then the shipped share/DIALibGen/instruments; default.yaml for the rest (docs/usage.md#instrument-defaults)" required="false" advanced="true" />
      <ITEM name="ids" value="" type="input-file" description="Refine, tune: the DIA-NN report.parquet of one run (or, with -empirical_library, a pre-filtered library)" required="false" advanced="false" supported_formats="*.parquet" />
      <ITEM name="no_filter" value="false" type="bool" description="Refine: keep the precursors the run did not identify (needs -tune or -no_write_rt, so that RT stays in one unit; JSON key filter)" required="false" advanced="false" />
      <ITEM name="no_write_rt" value="false" type="bool" description="Refine: keep the predicted RT (JSON key write_rt)" required="false" advanced="false" />
      <ITEM name="write_im" value="false" type="bool" description="Refine: also write the observed 1/K0 (ion-mobility runs), for charges &gt;= -im_min_charge" required="false" advanced="false" />
      <ITEM name="write_intensity" value="false" type="bool" description="Refine: also write the observed fragment intensities (a report exported with --report-lib-info (DIA-NN 1.9) or --export-quant (2.x)); fragments are cross-checked on m/z, and a run that replaces nothing is an error" required="false" advanced="false" />
      <ITEM name="q_precursor" value="0.01" type="double" description="Refine: precursor q-value cut-off (&gt;= 1 disables); -q_global and -q_protein add gates (--helphelp)" required="false" advanced="false" />
      <ITEM name="tune" value="false" type="bool" description="Refine: fine-tune RT (and CCS) on -ids and re-predict the whole library first, so precursors the run did not identify are corrected too (a training run plus whole-library prediction)" required="false" advanced="false" />
      <ITEM name="tune_heads" value="auto" type="string" description="Tune: models to fine-tune; auto = RT, plus CCS when the report has enough ion-mobility data" required="false" advanced="false" restrictions="auto,rt,ccs,both" />
      <ITEM name="tune_out_models" value="" type="string" description="Tune: also keep the tuned models (ONNX, with their .tune.json and .trajectory.tsv) in this directory" required="false" advanced="false" />
      <ITEM name="run" value="" type="input-file" description="Experimental: a centroided DIA run (mzML, or an mzPeak archive or its unpacked directory) that the built-in identification searches instead of reading -ids; not validated yet (-ids is). Settings: search:" required="false" advanced="true" supported_formats="*.mzML,*.mzpeak" />
      <ITEM name="out_ids" value="" type="output-file" description="With -run: the identification report it writes (Parquet, DIA-NN column names), then used as -ids. Default: &lt;out&gt;.ids.parquet. Never overwritten" required="false" advanced="true" supported_formats="*.parquet" />
      <ITEM name="out_report" value="" type="output-file" description="Refine, tune: per-axis residuals before the overwrite (TSV)" required="false" advanced="true" supported_formats="*.tsv" />
      <ITEM name="empirical_library" value="false" type="bool" description="Refine: -ids is a pre-filtered empirical library, not a report: gates whose columns are missing are bypassed and each bypass is recorded (without it a missing gate column is an error; JSON key require_gates)" required="false" advanced="true" />
      <ITEM name="q_global" value="1.0" type="double" description="Refine: global (peptide-level) q-value cut-off; 1 = off" required="false" advanced="true" />
      <ITEM name="q_protein" value="1.0" type="double" description="Refine: protein q-value cut-off; 1 = off" required="false" advanced="true" />
      <ITEM name="min_fragments" value="0" type="int" description="Refine: least distinct fragments the report identified per precursor (needs fragment identities in -ids); 0 = off" required="false" advanced="true" restrictions="0:" />
      <ITEM name="rt_unit" value="observed" type="string" description="Refine: observed = the run&apos;s own RT units; minmax = rescaled to 0..100 over the matched set (not with -no_filter or tuning)" required="false" advanced="true" restrictions="observed,minmax" />
      <ITEM name="dedup" value="lowest_q" type="string" description="Refine: which observation wins for a precursor seen more than once: lowest_q (ties: lower PEP, then first seen) or highest_evidence (needs an Evidence column)" required="false" advanced="true" restrictions="lowest_q,highest_evidence" />
      <ITEM name="min_match_fraction" value="0.0" type="double" description="Refine: refuse when fewer than this fraction of the passing report precursors are in the library; 0 = only when none is" required="false" advanced="true" />
      <ITEM name="im_min_charge" value="2" type="int" description="Refine, with -write_im: charges below this keep their predicted 1/K0 (z1 is censored at the ramp top on timsTOF diaPASEF)" required="false" advanced="true" />
      <ITEM name="im_ramp_top" value="0.0" type="double" description="Refine, with -write_im: the mobility ramp&apos;s top, if known; observations within -im_ramp_margin of it are censored. 0 = unknown" required="false" advanced="true" />
      <ITEM name="im_ramp_margin" value="0.02" type="double" description="Refine, with -write_im: see -im_ramp_top" required="false" advanced="true" />
      <ITEM name="intensity_min_correlation" value="0.0" type="double" description="Refine, with -write_intensity: least fragment quality (correlation in DIA-NN 1.9, Score in 2.x); -1 disables the gate" required="false" advanced="true" />
      <ITEM name="intensity_no_restrict" value="false" type="bool" description="Refine, with -write_intensity: replace a precursor only when every transition is trusted, else keep its predictions (neutral-loss transitions never match; JSON key intensity_restrict)" required="false" advanced="true" />
      <ITEM name="intensity_no_rerank" value="false" type="bool" description="Refine, with -write_intensity: keep a replaced precursor&apos;s transitions in their order (JSON key intensity_rerank)" required="false" advanced="true" />
      <ITEM name="intensity_min_fragments" value="3" type="int" description="Refine, with -write_intensity: a replaced precursor keeps at least this many transitions, or keeps its predictions" required="false" advanced="true" restrictions="0:" />
      <ITEM name="intensity_norm" value="library_max" type="string" description="Refine, with -write_intensity: how an observed area becomes an intensity; library_max scales to the precursor&apos;s previous maximum (the file&apos;s own convention)" required="false" advanced="true" restrictions="library_max,base_peak,sum,raw" />
      <ITEM name="intensity_min_relative" value="1.0e-04" type="double" description="Refine, with -write_intensity: drop observed intensities below this fraction of the kept maximum" required="false" advanced="true" />
      <ITEM name="intensity_mz_tol_ppm" value="20.0" type="double" description="Refine, with -write_intensity: a fragment matches only when the report&apos;s m/z agrees with the library&apos;s within this" required="false" advanced="true" />
      <ITEM name="intensity_max_mz_mismatch" value="0.01" type="double" description="Refine, with -write_intensity: refuse when more than this fraction of matches fail the m/z check; 1 surveys a suspect pairing" required="false" advanced="true" />
      <ITEM name="allow_mixed_intensity" value="false" type="bool" description="Refine: permit -write_intensity with -no_filter, which leaves observed and predicted intensities in one library (recorded)" required="false" advanced="true" />
      <ITEM name="tune_predict_sessions" value="0" type="int" description="Tune: ONNX Runtime sessions for the re-prediction; 0 = -threads" required="false" advanced="true" restrictions="0:" />
      <ITEM name="tune_keep_free_cysteine_offset" value="false" type="bool" description="Tune: keep the free-cysteine RT offset when re-predicting with the tuned RT model (off: the offset was fitted to the stock model, and a model tuned on the run has learned the effect)" required="false" advanced="true" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="0" type="int" description="Number of threads; 0 = all physical cores (the default when the command line and the INI do not set it)" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
      <NODE name="generation" description="Generate (FASTA to library)">
        <ITEM name="instrument" value="QE" type="string" description="Instrument of the run: Astral, Exploris, Lumos, QE, timsTOF, or a vendor name such as &apos;Orbitrap Astral&apos; or &apos;timsTOF Pro&apos;. Its defaults (instrument files, see --helphelp -instrument_file) set the NCE, ion mobility (timsTOF) and m/z windows and charges (Astral, timsTOF). Default: default.yaml&apos;s (QE)" required="false" advanced="false" />
        <ITEM name="nce" value="-1.0" type="double" description="Collision energy; -1 = the instrument&apos;s (Lumos and Astral 25, others 30)" required="false" advanced="false" restrictions="-1.0:100.0" />
        <ITEMLIST name="precursor_mz" type="double" description="Precursor m/z window; match it to the acquisition method. Default: the instrument&apos;s (Astral 380-980), else 350-1200" required="false" advanced="false">
        </ITEMLIST>
        <ITEMLIST name="fragment_mz" type="double" description="Fragment m/z window. Default: the instrument&apos;s (Astral 150-2000), else 200-1800" required="false" advanced="false">
        </ITEMLIST>
        <ITEMLIST name="precursor_charges" type="int" description="Precursor charges. Default: the instrument&apos;s (timsTOF 2-4), else 1-4" required="false" advanced="false" restrictions="1:8">
          <LISTITEM value="1"/>
          <LISTITEM value="2"/>
          <LISTITEM value="3"/>
          <LISTITEM value="4"/>
        </ITEMLIST>
        <ITEMLIST name="fixed_modifications" type="string" description="OpenMS names, e.g. &apos;Carbamidomethyl (C)&apos;; give the option without a value for none" required="false" advanced="false">
          <LISTITEM value="Carbamidomethyl (C)"/>
        </ITEMLIST>
        <ITEMLIST name="variable_modifications" type="string" description="OpenMS names, e.g. &apos;Oxidation (M)&apos;; at most -generation:max_variable_modifications (1) per peptide" required="false" advanced="false">
        </ITEMLIST>
        <ITEM name="enzyme" value="Trypsin/P" type="string" description="Protease; Trypsin/P also cuts before P" required="false" advanced="false" />
        <ITEM name="missed_cleavages" value="1" type="int" description="Missed cleavages per peptide" required="false" advanced="false" restrictions="0:" />
        <ITEMLIST name="peptide_length" type="int" description="Peptide length window, in residues" required="false" advanced="true">
          <LISTITEM value="7"/>
          <LISTITEM value="30"/>
        </ITEMLIST>
        <ITEM name="max_variable_modifications" value="1" type="int" description="Most variable modifications on one peptide" required="false" advanced="true" restrictions="0:" />
        <ITEM name="n_terminal_methionine_excision" value="true" type="string" description="Also digest each protein without its initiator methionine" required="false" advanced="true" restrictions="true,false" />
        <ITEMLIST name="fragments" type="int" description="Fragments per precursor: fewer than min drops the precursor, the most intense up to max are kept" required="false" advanced="true">
          <LISTITEM value="3"/>
          <LISTITEM value="12"/>
        </ITEMLIST>
        <ITEM name="max_fragment_charge" value="2" type="int" description="Highest fragment charge (1 or 2)" required="false" advanced="true" restrictions="1:2" />
        <ITEM name="min_relative_intensity" value="1.0e-04" type="double" description="Drop fragments below this fraction of the precursor&apos;s most intense one" required="false" advanced="true" restrictions="0.0:" />
        <ITEM name="reserved_doubly_charged" value="0" type="int" description="Fragment slots reserved for doubly charged ions; 0 ranks all fragments by predicted intensity" required="false" advanced="true" restrictions="0:" />
        <ITEM name="predict_ion_mobility" value="auto" type="string" description="Predict CCS (and 1/K0, see derive_ion_mobility). auto: only for an instrument with ion mobility (timsTOF); true: always; false: never, the library then carries neither" required="false" advanced="true" restrictions="auto,true,false" />
        <ITEM name="derive_ion_mobility" value="true" type="string" description="Also write 1/K0, derived from the predicted CCS (when CCS is predicted)" required="false" advanced="true" restrictions="true,false" />
        <ITEM name="irt_rescale" value="false" type="bool" description="Rescale RT to iRT with the standards of -irt_standards; false: RT is the model&apos;s raw 0..1 scale (DIA-NN fits its own RT map)" required="false" advanced="true" />
        <ITEM name="free_cysteine_rt_correction" value="true" type="string" description="Add the measured RT offset of unmodified cysteines (nothing to do when cysteines are alkylated)" required="false" advanced="true" restrictions="true,false" />
        <ITEM name="decoys" value="none" type="string" description="Decoys in the library: none (DIA-NN makes its own), mutate, pseudo_reverse, reverse, shuffle" required="false" advanced="true" restrictions="none,mutate,pseudo_reverse,reverse,shuffle" />
        <ITEM name="recompute_decoy_mz" value="false" type="bool" description="Recompute a decoy&apos;s precursor m/z from its decoy sequence (with -generation:decoys)" required="false" advanced="true" />
        <ITEM name="rt_model" value="" type="string" description="RT model (ONNX); default: peptdeep_rt_dynamic.onnx in -models" required="false" advanced="true" />
        <ITEM name="ms2_model" value="" type="string" description="MS2 model (ONNX); default: peptdeep_ms2_dynamic.onnx in -models" required="false" advanced="true" />
        <ITEM name="ccs_model" value="" type="string" description="CCS model (ONNX); default: peptdeep_ccs_dynamic.onnx in -models" required="false" advanced="true" />
      </NODE>
      <NODE name="filter" description="Fine-tuning: the training set (not the library: that is -q_precursor and the other gates)">
        <ITEM name="q_value" value="0.01" type="double" description="Precursor q-value cut-off of the training set" required="false" advanced="true" />
        <ITEM name="min_charge" value="2" type="int" description="CCS: lowest precursor charge (RT pools all charges; z1 is censored at the ramp top on timsTOF)" required="false" advanced="true" restrictions="1:8" />
        <ITEM name="allow_z1" value="false" type="bool" description="CCS: permit filter:min_charge 1 (censored observations then train)" required="false" advanced="true" />
        <ITEM name="rt_spread_max" value="0.2" type="double" description="Drop a sequence whose charge states&apos; RTs span more than this (minutes)" required="false" advanced="true" />
        <ITEM name="rt_max_minutes" value="0.0" type="double" description="RT normalisation; 0 = the run&apos;s latest observed RT" required="false" advanced="true" />
      </NODE>
      <NODE name="cohort" description="Fine-tuning: protein-level cohorts (frozen before subsampling)">
        <ITEM name="train_size" value="0" type="int" description="Training units (sequences for RT, sequence x charge for CCS); 0 = the whole pool" required="false" advanced="true" restrictions="0:" />
        <ITEM name="train_frac" value="0.0" type="double" description="Instead of train_size: the fraction of the pool" required="false" advanced="true" />
        <ITEM name="full_fit" value="false" type="bool" description="Train on every unit of the run, test and validation included: validation and test are then in-sample, so judge the result on a different run" required="false" advanced="true" />
        <ITEM name="no_inner_val" value="false" type="bool" description="No inner validation cohort: its units rejoin the pool and checkpoints are selected on the test cohort, which is then no longer held out" required="false" advanced="true" />
      </NODE>
      <NODE name="train" description="Fine-tuning: recipe">
        <ITEM name="epochs" value="100" type="int" description="Length of the cosine schedule (and the most epochs)" required="false" advanced="true" restrictions="1:" />
        <ITEM name="warmup" value="10" type="int" description="Linear warm-up epochs" required="false" advanced="true" restrictions="0:" />
        <ITEM name="lr" value="1.0e-04" type="double" description="Peak learning rate (Adam)" required="false" advanced="true" />
        <ITEM name="batch_size" value="1024" type="int" description="Batch size within a length group" required="false" advanced="true" restrictions="1:" />
      </NODE>
      <NODE name="stop" description="Fine-tuning: convergence">
        <ITEM name="eval_every" value="1" type="int" description="Validate every n epochs" required="false" advanced="true" restrictions="1:" />
        <ITEM name="min_epochs" value="20" type="int" description="Never stop before this epoch" required="false" advanced="true" restrictions="0:" />
        <ITEM name="patience" value="10" type="int" description="Stop after this many epochs without progress (not before max(min_epochs, warmup))" required="false" advanced="true" restrictions="0:" />
        <ITEM name="rel_tol" value="5.0e-03" type="double" description="Progress: the selection metric beats the best so far by this fraction" required="false" advanced="true" />
        <ITEM name="abs_tol" value="0.0" type="double" description="Progress: ... by this absolute amount (0 = use rel_tol)" required="false" advanced="true" />
        <ITEM name="max_seconds" value="0.0" type="double" description="Time budget per head, checked between epochs (the final evaluation may exceed it); 0 = none" required="false" advanced="true" />
        <ITEM name="select" value="calibrated_sd" type="string" description="Selection metric on the validation cohort" required="false" advanced="true" restrictions="calibrated_sd,rmse" />
      </NODE>
      <NODE name="machine" description="Devices">
        <ITEM name="device" value="auto" type="string" description="Auto: the GPU when one is usable and pays off (NVIDIA: CUDA, RT and CCS with cuDNN 9; Apple: CoreML for MS2 of large libraries, MPS for fine-tuning), else the CPU; cpu: CPU only (the reference); also cuda[:N], coreml, mps" required="false" advanced="false" />
        <ITEM name="coreml_units" value="gpu" type="string" description="CoreML compute units: gpu (CPU and GPU, fastest), all (Core ML&apos;s choice, Neural Engine included), ane (CPU and Neural Engine), cpu (checks)" required="false" advanced="true" restrictions="gpu,all,ane,cpu" />
        <ITEM name="train_threads" value="0" type="int" description="CPU threads for fine-tuning (0: 16 on Linux and Windows, 8 on macOS). On Linux the tuned weights depend on the count (recorded); on macOS they do not" required="false" advanced="true" restrictions="0:" />
        <ITEM name="cores" value="all" type="string" description="MacOS: which cores -threads 0 counts: all, or performance (saves energy, not time). Does not change the output" required="false" advanced="true" restrictions="all,performance" />
        <ITEM name="no_cudnn" value="false" type="bool" description="CUDA fine-tuning without cuDNN (when only its loader shim is installed, as in pytorch.org&apos;s libtorch zips); slower" required="false" advanced="true" />
        <ITEM name="seed" value="20260803" type="int" description="Seed of the training subsample and batch order" required="false" advanced="true" restrictions="0:" />
        <ITEM name="tf32" value="false" type="bool" description="TensorFloat-32 on NVIDIA GPUs, for prediction and fine-tuning: faster, but about 1 % of precursors select a different fragment set (off: GPU and CPU agree to float rounding)" required="false" advanced="true" />
        <ITEM name="gpu_sessions" value="4" type="int" description="CUDA: ONNX Runtime sessions per GPU and model, each with its own stream; CoreML: concurrent batches. Does not change the output" required="false" advanced="true" restrictions="1:16" />
        <ITEMLIST name="gpu_devices" type="int" description="CUDA devices to spread the sessions over (e.g. 0 1). Default: the first that works. Does not change the output" required="false" advanced="true" restrictions="0:">
        </ITEMLIST>
        <ITEM name="require_gpu" value="false" type="bool" description="Fail instead of predicting on the CPU when -machine:device asks for a GPU (or auto finds one) that a model cannot use" required="false" advanced="true" />
      </NODE>
      <NODE name="search" description="Built-in identification with -run (experimental; docs/design/built-in-identification.md)">
        <ITEM name="candidates" value="evidence" type="string" description="Candidate pairs: evidence = target-decoy pairs of which either member has fragment evidence in the run (search:prefilter_*); random = a deterministic, label-blind random subset (search:subset)" required="false" advanced="true" restrictions="evidence,random" />
        <ITEM name="subset" value="0" type="int" description="Random candidates: targets drawn before the cap (0 = every eligible target)" required="false" advanced="true" restrictions="0:" />
        <ITEM name="max_pairs" value="200000" type="int" description="Most target-decoy pairs searched; time is linear in pairs (0 = no cap). Evidence candidates are capped per isolation window, RT decile and charge, keeping the most evidence" required="false" advanced="true" restrictions="0:" />
        <ITEM name="prefilter_depth" value="5" type="int" description="Evidence candidates: a pair is kept when either member has this many of its 6 most intense predicted fragments among one spectrum&apos;s top peaks" required="false" advanced="true" restrictions="1:6" />
        <ITEM name="prefilter_top_peaks" value="1000" type="int" description="Evidence candidates: the most intense peaks per MS2 spectrum that the prefilter matches" required="false" advanced="true" restrictions="1:" />
        <ITEM name="prefilter_ppm" value="10.0" type="double" description="Evidence candidates: fragment tolerance, ppm either side" required="false" advanced="true" restrictions="0.1:100.0" />
        <ITEM name="decoys" value="shuffle" type="string" description="How the search builds its in-memory decoys (both keep the termini); decoys in the library are not searched and stay in the output" required="false" advanced="true" restrictions="shuffle,pseudo_reverse" />
        <ITEM name="intensities" value="predicted" type="string" description="Validation only: fragments of both pair members. predicted = predicted from each member&apos;s own sequence by the MS2 model (-models); library = the target&apos;s assay, the decoy in its target&apos;s fragment slots (weaker decoys)" required="false" advanced="true" restrictions="predicted,library" />
        <ITEM name="instrument" value="auto" type="string" description="Predicted intensities: the MS2 model&apos;s instrument; auto = the one the library records, else timsTOF for an ion-mobility run and QE otherwise" required="false" advanced="true" />
        <ITEM name="nce" value="-1.0" type="double" description="Predicted intensities: the MS2 model&apos;s collision energy; -1 = the one the library records with its instrument, else the instrument&apos;s" required="false" advanced="true" restrictions="-1.0:100.0" />
        <ITEM name="seed" value="42" type="int" description="Salt of the candidate draw: changes which pairs are searched, not how" required="false" advanced="true" restrictions="0:" />
        <ITEM name="rt_window" value="0.0" type="double" description="Full RT extraction window, seconds (0 = from the calibration)" required="false" advanced="true" restrictions="0.0:" />
        <ITEM name="mz_ppm" value="0.0" type="double" description="Full fragment m/z extraction window, ppm (0 = automatic)" required="false" advanced="true" restrictions="0.0:" />
        <ITEM name="im_window" value="0.0" type="double" description="Full 1/K0 extraction window on ion-mobility runs: 0 = from the run&apos;s 1/K0 calibration; &gt; 0 = this width; -1 = off (no observed 1/K0: -write_im and the CCS head are refused)" required="false" advanced="true" restrictions="-1.0:" />
        <ITEM name="ms1" value="true" type="string" description="Extract MS1 traces and use the MS1 sub-scores" required="false" advanced="true" restrictions="true,false" />
        <ITEM name="rt_im_scores" value="true" type="string" description="Validation only: false keeps the RT and 1/K0 deviation sub-scores out of the classifier (an ablation)" required="false" advanced="true" restrictions="true,false" />
        <ITEM name="calibration_min_rsq" value="0.7" type="double" description="Least r^2 of the RT calibration on the seed assays" required="false" advanced="true" restrictions="0.0:1.0" />
        <ITEM name="calibration_min_coverage" value="0.3" type="double" description="Least fraction of the seed assays found in the run that the RT outlier removal must keep" required="false" advanced="true" restrictions="0.0:1.0" />
        <ITEM name="readoptions" value="auto" type="string" description="How the run is held: normal = in memory, cache = per-window cache files, auto = cache for runs above 3 GB" required="false" advanced="true" restrictions="auto,normal,cache" />
        <ITEM name="cache_dir" value="" type="string" description="Directory of the cache files (default: that of -out_ids); removed after the search" required="false" advanced="true" />
        <ITEM name="ms1_in_memory" value="auto" type="string" description="Memory: hold the MS1 map in memory during extraction (auto = when the free memory is at least twice its size; on; off). Changes speed and memory, never the report" required="false" advanced="true" restrictions="auto,on,off" />
        <ITEM name="min_ids" value="200" type="int" description="Abort when fewer target precursors pass q &lt;= 0.01" required="false" advanced="true" restrictions="0:" />
        <ITEM name="max_target_fraction" value="0.5" type="double" description="Abort when more than this fraction of the scored targets passes q &lt;= 0.01 (no honest decoy set looks like that)" required="false" advanced="true" restrictions="0.01:1.0" />
        <ITEM name="report_max_q" value="0.1" type="double" description="Precursors (targets and decoys) up to this q-value go into -out_ids" required="false" advanced="true" restrictions="0.01:1.0" />
        <ITEM name="entrapment_tag" value="" type="string" description="Validation only: prefix of entrapment protein ids (at the start or after a &apos;|&apos;); logs and records the entrapment FDP estimate and winner test" required="false" advanced="true" />
        <ITEM name="selftest" value="true" type="string" description="Also score with swapped and with random pair labels and abort unless both identify (almost) nothing (catches a classifier that leaks labels)" required="false" advanced="true" restrictions="true,false" />
        <ITEM name="batch_size" value="100" type="int" description="Memory: precursors per extraction batch within one isolation window (the report does not depend on it)" required="false" advanced="true" restrictions="1:" />
        <ITEM name="chunk" value="20000" type="int" description="Memory: precursors per extraction call (pairs stay together); bounds extraction memory, not the calibration&apos;s" required="false" advanced="true" restrictions="2:" />
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>
