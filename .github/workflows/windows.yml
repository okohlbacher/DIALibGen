name: windows

# Build OpenMS from source because bioconda has no Windows package.
# A separate cached dependency job survives product-build failures.

on:
  push:
    branches: [main]
    tags: ['v*']
    # Avoid rebuilding for documentation-only changes.
    paths:
      - '.github/workflows/windows.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'gui/**'
  pull_request:
    paths:
      - '.github/workflows/windows.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'test/**'
  workflow_dispatch:
    inputs:
      gui_dry_run:
        description: 'Build the desktop app without cutting a tag'
        type: boolean
        default: false
      cli_dry_run:
        description: 'Package and verify the CLI without building desktop installers or cutting a tag'
        type: boolean
        default: false

concurrency:
  # Give manual dispatches independent concurrency groups.
  group: windows-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  # Queue runs so interrupted OpenMS builds do not lose their dependency caches.
  cancel-in-progress: false

env:
  # Pin release/3.5.0's commit (its source metadata reports version 3.6.0).
  OPENMS_SHA: c49149d47d6fcc76d1271d87d3a7fad15d2219de
  # Use available contrib sources with MSVC-compatible Boost and kissfft.
  # OpenMS 3.5's original contrib pin references deleted source archives.
  CONTRIB_REV: 186aacfbc1157719735b497cd6de1b3e83289eea

jobs:
  # OpenMS dependencies and development files.
  openms:
    name: windows-x64-openms
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      # Initialize cl.exe for contrib architecture detection and later build steps.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64

      - name: Check out OpenMS at the pinned commit
        shell: bash
        run: |
          set -euo pipefail
          git init -q openms-src
          cd openms-src
          git remote add origin https://github.com/OpenMS/OpenMS.git
          # Fetch the advertised release tag, then verify its commit.
          git fetch -q --depth 1 origin refs/tags/release/3.5.0
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$OPENMS_SHA" \
            || { echo "::error::release/3.5.0 is no longer $OPENMS_SHA"; exit 1; }

          # OpenMS 3.5 omits <functional> for std::divides; MSVC requires it.
          # Guard the patch so upstream changes fail explicitly.
          F=src/openms/source/ANALYSIS/OPENSWATH/DIAPrescoring.cpp
          if grep -q "std::divides" "$F" && ! grep -q "^#include <functional>" "$F"; then
            grep -q "^#include <utility>" "$F" \
              || { echo "::error::$F no longer includes <utility>; re-anchor this patch"; exit 1; }
            sed -i 's|^#include <utility>|#include <utility>\n#include <functional>|' "$F"
            grep -q "^#include <functional>" "$F" \
              || { echo "::error::failed to add <functional> to $F"; exit 1; }
            echo "patched $F with <functional>"
          fi

      - name: Check out contrib at the pinned commit
        shell: bash
        run: |
          set -euo pipefail
          git init -q contrib-src
          cd contrib-src
          git remote add origin https://github.com/OpenMS/contrib.git
          git fetch -q --depth 1 origin "$CONTRIB_REV"
          git checkout -q FETCH_HEAD

          # Require the pinned contrib to reference an available source release.
          grep -q "releases/download/3.6.0/" macros.cmake \
            || { echo "::error::contrib $CONTRIB_REV no longer downloads from the 3.6.0 sources"; exit 1; }

      # Cache keys include the repository name because installed OpenMS embeds its path.
      - name: Cache contrib build
        id: cache-contrib
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: contrib-build
          key: windows-x64-contrib-${{ github.event.repository.name }}-${{ env.CONTRIB_REV }}-v1

      - name: Build contrib
        if: steps.cache-contrib.outputs.cache-hit != 'true'
        run: |
          cmake -S contrib-src -B contrib-build -G "Visual Studio 17 2022" -A x64 -DBUILD_TYPE=ALL
          cmake --build contrib-build --config Release

      # Use Eigen and Ninja from Chocolatey, matching OpenMS's Windows build.
      - name: Install Eigen and Ninja
        run: |
          choco install -y --no-progress eigen --version=3.4.0.20240224
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install -y --no-progress ninja --version=1.13.2

      # OpenMS requires these Qt modules even when its GUI is disabled.
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: 'false'
          archives: 'qtbase qtsvg qtimageformats'

      # Omit unused Arrow Dataset/Acero, whose LibXml2 discovery fails with this MSVC layout.
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          auto-update-conda: true
          activate-environment: dialibgen-deps
          python-version: '3.11'

      - name: Install the conda dependencies
        shell: bash -el {0}
        run: |
          set -euo pipefail
          conda install -y -c conda-forge libarrow libparquet libzip nlohmann_json
          PREFIX=$(python -c "import sys,os;print(os.environ['CONDA_PREFIX'].replace(os.sep,'/'))")
          echo "CONDA_LIB_PREFIX=$PREFIX/Library" >> "$GITHUB_ENV"

      # Install curl alongside contrib and use Windows Schannel for TLS.
      - name: Build libcurl from source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o curl-src.tar.gz https://curl.se/download/curl-8.12.1.tar.gz
          echo "7b40ea64947e0b440716a4d7f0b7aa56230a5341c8377d7b609649d4aea8dbcf  curl-src.tar.gz" | sha256sum -c -
          tar xzf curl-src.tar.gz
          cd curl-8.12.1
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/contrib-build" \
            -DBUILD_SHARED_LIBS=ON \
            -DCURL_USE_SCHANNEL=ON \
            -DBUILD_CURL_EXE=OFF \
            -DBUILD_TESTING=OFF \
            -DCURL_DISABLE_LDAP=ON \
            -DCURL_USE_LIBPSL=OFF
          cmake --build build
          cmake --install build

      - name: Cache OpenMS install
        id: cache-openms
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: openms-install
          key: windows-x64-openms-${{ github.event.repository.name }}-${{ env.OPENMS_SHA }}-${{ env.CONTRIB_REV }}-v1

      - name: Configure OpenMS
        if: steps.cache-openms.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Build only the OpenMS library and development files needed by DIALibGen.
          cmake -S openms-src -B openms-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENMS_CONTRIB_LIBS="$GITHUB_WORKSPACE/contrib-build" \
            -DWITH_GUI=OFF \
            -DENABLE_TOPP_TESTING=OFF \
            -DENABLE_CLASS_TESTING=OFF \
            -DENABLE_DOCS=OFF \
            -DENABLE_STYLE_TESTING=OFF \
            -DENABLE_CWL=OFF \
            -DMT_ENABLE_OPENMP=ON \
            -DUSE_EXTERNAL_JSON=OFF \
            -DEigen3_DIR="C:/ProgramData/chocolatey/lib/eigen/share/cmake" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$CONDA_LIB_PREFIX" \
            -DARROW_USE_STATIC=OFF \
            -DArrow_DIR="$CONDA_LIB_PREFIX/lib/cmake/Arrow" \
            -DParquet_DIR="$CONDA_LIB_PREFIX/lib/cmake/Parquet" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/openms-install"

      - name: Build and install OpenMS
        if: steps.cache-openms.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build openms-build --parallel
          cmake --build openms-build --target install

      - name: Verify OpenMS installed its development files
        shell: bash
        run: |
          set -euo pipefail
          CFG=$(find openms-install -name 'OpenMSConfig.cmake' | head -1)
          [ -n "$CFG" ] || { echo "::error::no OpenMSConfig.cmake after install"; exit 1; }
          HDR=$(find openms-install -name 'TOPPBase.h' | head -1)
          [ -n "$HDR" ] || { echo "::error::installed OpenMS has no TOPPBase.h"; exit 1; }
          echo "found: $CFG"
          echo "found: $HDR"
          # OpenMS 3.5 omits its Find modules; the product job supplies them separately.
          if [ ! -f "$(dirname "$CFG")/Modules/FindLIBSVM.cmake" ]; then
            echo "::warning::installed OpenMS has no CMake/Modules -- consumers must supply them"
          fi

  # DIALibGen uses the cached dependency builds on a fresh runner.
  tool:
    name: windows-x64
    runs-on: windows-2022
    needs: openms
    timeout-minutes: 180
    # Release asset uploads require write permission; fork PR tokens remain read-only.
    permissions:
      contents: write
    steps:
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore contrib build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: contrib-build
          key: windows-x64-contrib-${{ github.event.repository.name }}-${{ env.CONTRIB_REV }}-v1

      - name: Restore OpenMS install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: openms-install
          key: windows-x64-openms-${{ github.event.repository.name }}-${{ env.OPENMS_SHA }}-${{ env.CONTRIB_REV }}-v1

      - name: Install Eigen and Ninja
        run: |
          choco install -y --no-progress eigen --version=3.4.0.20240224
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install -y --no-progress ninja --version=1.13.2

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: 'false'
          archives: 'qtbase qtsvg qtimageformats'

      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          auto-update-conda: true
          activate-environment: dialibgen-deps
          python-version: '3.11'

      - name: Install the conda dependencies
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # Use ONNX Runtime directly to support modified peptides.
          conda install -y -c conda-forge libarrow libparquet libzip nlohmann_json \
            onnxruntime-cpp numpy pyarrow onnxruntime pyyaml
          PREFIX=$(python -c "import sys,os;print(os.environ['CONDA_PREFIX'].replace(os.sep,'/'))")
          echo "CONDA_LIB_PREFIX=$PREFIX/Library" >> "$GITHUB_ENV"
          # Select and validate the Python environment containing the reference-test dependencies.
          # An empty interpreter path would silently unregister those tests.
          CP=$(python -c 'import sys; print(sys.executable)')
          CP=${CP//\\//}
          [ -x "$CP" ] || { echo "::error::conda python not found (got '$CP')"; exit 1; }
          "$CP" -c 'import numpy, pyarrow, onnxruntime' \
            || { echo "::error::$CP lacks the test dependencies"; exit 1; }
          echo "CONDA_PYTHON=$CP" >> "$GITHUB_ENV"

      - name: Restore the CPU libtorch SDK
        id: torch-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: libtorch-sdk
          key: libtorch-cpu-2.10.0-windows-x64-17a09465-v3

      - name: Extract the CPU libtorch SDK
        if: steps.torch-cache.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: python .github/fetch-libtorch.py windows-x64 libtorch-sdk

      - name: Restore the PeptDeep models
        id: cache-models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: models
          key: peptdeep-models-ccs41816f32-ms24141ea23-rt3f3b847e

      - name: Fetch the PeptDeep models
        if: steps.cache-models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          fetch() {
            curl -fsSL --retry 3 -o "models/$1" "https://archive.openms.de/openms/models/$1"
            echo "$2 *models/$1" | sha256sum -c -
          }
          fetch peptdeep_ccs_dynamic.onnx 41816f325cdd838897b7e7dcaf291da5d4d3903a1532fc5dc9db7e0725015801
          fetch peptdeep_ms2_dynamic.onnx 4141ea233d663b6f5b98ad80b8923ee685dae5cfdbe12243e2e30cd9c44ecf00
          fetch peptdeep_rt_dynamic.onnx  3f3b847ea37a9333ac163409f3d4b343d021471548091c61aed6cfa398ce62fd

      - name: Verify cached prediction models
        shell: bash
        run: bash scripts/fetch-models.sh --check --dir models

      # Fetch OpenMS 3.5's omitted Find modules and add them to CMAKE_MODULE_PATH.
      - name: Fetch OpenMS's CMake find modules
        shell: bash
        run: |
          set -euo pipefail
          git init -q openms-modules-src
          cd openms-modules-src
          git remote add origin https://github.com/OpenMS/OpenMS.git
          git config core.sparseCheckout true
          git sparse-checkout set --no-cone cmake/Modules
          git fetch -q --depth 1 origin refs/tags/release/3.5.0
          git checkout -q FETCH_HEAD
          test -f cmake/Modules/FindLIBSVM.cmake \
            || { echo "::error::no FindLIBSVM.cmake in the sparse checkout"; exit 1; }
          echo "OPENMS_MODULES=$PWD/cmake/Modules" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # Let DIALibGen choose its Eigen version-range shim; do not pin Eigen3_DIR here.
          OPENMS_DIR=$(dirname "$(find openms-install -name 'OpenMSConfig.cmake' | head -1)")

          # OpenMS installs its config and targets to different Windows directories.
          # Redirect the include to the targets' actual location; moving the file
          # would break its relative install-prefix calculation.
          if [ ! -f "$OPENMS_DIR/OpenMSTargets.cmake" ]; then
            TGT=$(find openms-install -name 'OpenMSTargets.cmake' | head -1)
            [ -n "$TGT" ] \
              || { echo "::error::OpenMS installed no OpenMSTargets.cmake at all"; exit 1; }
            ABS=$(cd "$(dirname "$TGT")" && pwd)/OpenMSTargets.cmake
            python - "$OPENMS_DIR/OpenMSConfig.cmake" "$ABS" <<'PYEOF'
          import re, sys
          cfg, target = sys.argv[1], sys.argv[2].replace("\\", "/")
          s = open(cfg).read()
          # Match the OpenMSTargets include independently of the variable naming its directory.
          pat = re.compile(r'^\s*include\([^)\n]*OpenMSTargets\.cmake[^)\n]*\)\s*$', re.M)
          hits = pat.findall(s)
          if not hits:
              sys.exit(f"{cfg}: no OpenMSTargets include to redirect")
          if len(hits) != 1:
              sys.exit(f"{cfg}: {len(hits)} OpenMSTargets includes, expected 1: {hits}")
          open(cfg, "w").write(pat.sub(f'include("{target}")', s))
          print(f"redirected {hits[0].strip()} -> {target}")
          PYEOF
          fi

          # Record the installed ONNX Runtime layout for configure diagnostics.
          find "$CONDA_LIB_PREFIX" -iname 'onnxruntime*' -maxdepth 4 | head -20 || true
          find "$CONDA_LIB_PREFIX" -name 'onnxruntime_cxx_api.h' | head -3 || true

          echo "OPENMS_DIR=$OPENMS_DIR" >> "$GITHUB_ENV"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOpenMS_DIR="$OPENMS_DIR" \
            -DCMAKE_PREFIX_PATH="$CONDA_LIB_PREFIX;$QT_ROOT_DIR;$GITHUB_WORKSPACE/contrib-build" \
            -DCMAKE_MODULE_PATH="$OPENMS_MODULES" \
            -DODIA_PYTHON="$CONDA_PYTHON" \
            -DDIALIBGEN_REFINEMENT_PYTHON="$CONDA_PYTHON" \
            -DODIA_MODEL_DIR="$PWD/models" \
            -DDIALIBGEN_BUILD_FINETUNE=ON \
            -DTorch_DIR="$PWD/libtorch-sdk/share/cmake/Torch" \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage"

      - name: Build and install
        shell: bash -el {0}
        run: |
          set -euo pipefail
          cmake --build build --parallel 2
          cmake --install build

      # Reuse the runtime dependency directories for tests and bundle assembly.
      - name: Collect the runtime DLL directories
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # Use absolute DLL paths because CTest changes the working directory.
          _dll=$(find openms-install -name 'OpenMS.dll' | head -1)
          [ -n "$_dll" ] || { echo "::error::no OpenMS.dll in the install"; exit 1; }
          OPENMS_BIN=$(cd "$(dirname "$_dll")" && pwd)

          # Keep Windows and Git Bash path spellings separately. Convert each path
          # with cygpath; replacing semicolons would split Windows drive letters.
          RUNTIME_DLL_PATH="$GITHUB_WORKSPACE/libtorch-sdk/lib;$CONDA_LIB_PREFIX/bin;$QT_ROOT_DIR/bin;$GITHUB_WORKSPACE/contrib-build/bin;$OPENMS_BIN"
          POSIX=""
          IFS=';' read -ra _dirs <<< "$RUNTIME_DLL_PATH"
          for d in "${_dirs[@]}"; do
            [ -n "$d" ] || continue
            POSIX="$POSIX:$(cygpath -u "$d")"
          done
          POSIX="${POSIX#:}"
          # Require absolute paths for every runtime directory.
          IFS=':' read -ra _check <<< "$POSIX"
          for d in "${_check[@]}"; do
            case "$d" in
              /*) ;;
              *) echo "::error::DLL path entry is not absolute: $d"; exit 1 ;;
            esac
            [ -d "$d" ] || echo "::warning::DLL path entry does not exist: $d"
          done
          echo "RUNTIME_DLL_PATH=$RUNTIME_DLL_PATH" >> "$GITHUB_ENV"
          echo "DLL_PATH_POSIX=$POSIX" >> "$GITHUB_ENV"
          echo "posix dll path: $POSIX"

      - name: Test
        shell: bash -el {0}
        run: |
          set -euo pipefail
          export PATH="$DLL_PATH_POSIX:$PATH"
          # Pass explicit DLL paths through standalone_test.sh's empty environment.
          # Preserve toolchain CRT directories while removing the product build tree.
          BUILD_ABS=$(cd build && pwd)
          FILTERED=""
          IFS=':' read -ra _entries <<< "$PATH"
          for d in "${_entries[@]}"; do
            case "$d" in "$BUILD_ABS"|"$BUILD_ABS"/*) continue ;; esac
            FILTERED="$FILTERED:$d"
          done
          export PATH_KEEP="$DLL_PATH_POSIX${FILTERED}"
          case "$PATH_KEEP" in
            *"$BUILD_ABS"*) echo "::error::the build tree survived the PATH filter"; exit 1 ;;
          esac
          ctest --test-dir build -N > registered-tests.txt
          for name in tune_parity tune_e2e; do
            grep -Eq "[ :]+$name$" registered-tests.txt \
              || { echo "::error::$name is not registered; this release must include training"; exit 1; }
          done
          ctest --test-dir build --output-on-failure --timeout 2400 --output-junit "$PWD/build/ctest.xml"
          python - <<'PYTEST'
          import xml.etree.ElementTree as ET
          tests = {case.get("name"): case for case in ET.parse("build/ctest.xml").iter("testcase")}
          required = {
              "tune_parity", "tune_e2e", "tune_parameter_contract", "tune_training_contract", "e2e",
              "peptdeep_predictions_match_reference", "peptdeep_ccs_matches_reference",
              "peptdeep_ms2_matches_reference", "irt_calibration_matches_openms",
              "ms2_sessions_are_deterministic", "free_cysteine_correction", "decoy_methods_distinct",
              "library_io_contract", "text_writer_contract", "atomic_file_contract", "refinement_report_contract",
              "peptdeep_reference_encoding", "peptdeep_element_table", "peptdeep_meta_inputs",
              "peptdeep_encoder_matches_reference", "topp_parameters", "parameter_docs_current",
          }
          assert required <= tests.keys(), f"required tests missing: {required - tests.keys()}"
          for name, case in tests.items():
              assert case.find("skipped") is None, f"{name} must pass, not skip"
          PYTEST

      - name: Diagnose a Windows report-reader crash
        if: failure()
        timeout-minutes: 5
        shell: bash -el {0}
        run: |
          export PATH="$DLL_PATH_POSIX:$PATH"
          CDB='/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe'
          TEST=build/test/refinement/dialibgen_intensity_match.exe
          if [ -x "$CDB" ] && [ -f "$TEST" ]; then
            "$CDB" -o -G -c 'sxe av; g; .ecxr; kb; lm; q' "$TEST" > windows-reader-crash.txt 2>&1
            cat windows-reader-crash.txt
          else
            echo "CDB or the report-reader test is unavailable; use the test's stage diagnostics."
          fi

      - name: Verify installed CMake libraries
        shell: bash -el {0}
        run: |
          cmake -S test/consumer -B consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DOpenMS_DIR="$OPENMS_DIR" \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$PWD/stage");$CONDA_LIB_PREFIX;$QT_ROOT_DIR;$GITHUB_WORKSPACE/contrib-build" \
            -DCMAKE_MODULE_PATH="$OPENMS_MODULES" \
            -DTorch_DIR="$PWD/libtorch-sdk/share/cmake/Torch"
          cmake --build consumer -j 2
          export PATH="$DLL_PATH_POSIX:$PATH"
          ctest --test-dir consumer --output-on-failure

      - name: The installed binary stands on its own
        shell: bash -el {0}
        run: |
          set -euo pipefail
          BIN="$PWD/stage/bin/DIALibGen.exe"
          test -x "$BIN" || { echo "::error::no installed binary at $BIN"; exit 1; }
          test -s "$PWD/stage/share/DIALibGen/irt_standards.tsv" \
            || { echo "::error::the iRT standards are not in the install tree"; exit 1; }

          # Require all three bundled prediction models.
          for m in peptdeep_rt_dynamic.onnx peptdeep_ms2_dynamic.onnx peptdeep_ccs_dynamic.onnx; do
            test -s "$PWD/stage/share/DIALibGen/models/$m" \
              || { echo "::error::$m is not in the install tree"; exit 1; }
          done

          # Restore runtime dependency paths explicitly in the empty-environment check.
          PATH_KEEP="$DLL_PATH_POSIX:$(cygpath -S):/usr/bin:/bin"
          export PATH_KEEP
          bash test/standalone_test.sh "$BIN" \
            "$(sed -n 's/^  VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" \
            example/proteins.fasta
          bash test/write_ctd_test.sh "$BIN"

      - name: Build a real library
        shell: bash -el {0}
        run: |
          set -euo pipefail
          export PATH="$DLL_PATH_POSIX:$PATH"
          # Leave DIALIBGEN_MODEL_DIR unset to verify bundled-model discovery.
          BIN="$PWD/stage/bin/DIALibGen.exe"
          "$BIN" -in example/proteins.fasta -out out.parquet
          "$BIN" -in example/proteins.fasta -out out.tsv
          test -s out.parquet || { echo "::error::no Parquet library"; exit 1; }
          [ "$(wc -l < out.tsv)" -gt 1 ] || { echo "::error::the TSV library has no rows"; exit 1; }
          python - <<'PY'
          import pyarrow.parquet as pq, json, sys
          f = pq.ParquetFile("out.parquet")
          if f.metadata.num_rows == 0:
              sys.exit("::error::the Parquet library has no rows")
          if not (f.schema_arrow.metadata or {}).get(b"odia.config_json"):
              sys.exit("::error::the Parquet library does not carry odia.config_json")
          cfg = json.loads(f.schema_arrow.metadata[b"odia.config_json"])
          for key in ("enzyme", "fixed_modifications", "schema_version"):
              if key not in cfg:
                  sys.exit(f"::error::the embedded recipe is missing {key!r}")
          print(f"library: {f.metadata.num_rows} precursors")
          PY
          for col in Precursor.Id Modified.Sequence Precursor.Mz Product.Mz \
                     Relative.Intensity Fragment.Type Protein.Group; do
            head -1 out.tsv | tr '\t' '\n' | grep -qxF "$col" \
              || { echo "::error::the TSV header has no $col column"; exit 1; }
          done

      # Portable bundles carry the executable, runtime DLLs, models and data.
      - name: Exercise all installed modes
        shell: bash -el {0}
        run: |
          export PATH="$DLL_PATH_POSIX:$PATH"
          "$CONDA_PYTHON" .github/release-smoke.py stage/bin/DIALibGen.exe --output smoke-installed

      - name: Decide whether to package
        id: pkg
        shell: bash
        run: |
          # Check event_name first so a manual dispatch against a tag cannot publish.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "gui=${{ inputs.gui_dry_run }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.cli_dry_run }}" = "true" ] || [ "${{ inputs.gui_dry_run }}" = "true" ]; then
              echo "package=true" >> "$GITHUB_OUTPUT"
            else
              echo "package=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            printf '%s\n' package=true release=true gui=true >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' package=false release=false gui=false >> "$GITHUB_OUTPUT"
          fi

      - name: Stage a portable bundle
        if: steps.pkg.outputs.package == 'true'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # Source installs retain the SDK; portable applications carry only runtime files.
          rm -rf stage/include stage/lib/cmake stage/lib/*.a stage/lib/*.lib stage/bin/dialibgen-fetch-models

          # Bundle OpenMS data and verify CHEMISTRY/unimod.xml, its runtime path marker.
          UNIMOD=$(find openms-install -path '*CHEMISTRY/unimod.xml' | head -1)
          [ -n "$UNIMOD" ] \
            || { echo "::error::no CHEMISTRY/unimod.xml in the OpenMS install"; exit 1; }
          SHARE=$(cd "$(dirname "$UNIMOD")/.." && pwd)
          mkdir -p stage/share/OpenMS
          cp -R "$SHARE/." stage/share/OpenMS/
          test -s stage/share/OpenMS/CHEMISTRY/unimod.xml \
            || { echo "::error::the staged tree is not a valid OpenMS data path"; exit 1; }
          echo "staged OpenMS data from $SHARE"

          # Copy the imported DLL dependency closure instead of every installed DLL.
          command -v dumpbin >/dev/null \
            || { echo "::error::no dumpbin on PATH; cannot compute the DLL closure"; exit 1; }
          IFS=';' read -ra PREFIXES <<< "$RUNTIME_DLL_PATH"

          # Resolve dependencies in runtime search order; system DLLs remain external.
          # Copy each file once without relying on platform-specific cp -n exit status.
          : > runtime-origins.tsv
          copy_once() {
            local base
            base=$(basename "$1")
            if [ ! -f "stage/bin/$base" ]; then
              cp "$1" stage/bin/
              printf 'bin/%s\t%s\n' "$base" "$(cygpath -am "$1")" >> runtime-origins.tsv
            fi
          }

          resolve() {
            local d hit
            for d in "${PREFIXES[@]}"; do
              [ -d "$d" ] || continue
              hit=$(find "$d" -maxdepth 1 -iname "$1" | head -1)
              if [ -n "$hit" ]; then printf '%s\n' "$hit"; return 0; fi
            done
            return 1
          }

          declare -A seen=()
          todo=(stage/bin/DIALibGen.exe)
          while [ ${#todo[@]} -gt 0 ]; do
            f="${todo[0]}"; todo=("${todo[@]:1}")
            # Use -dependents and relative paths to avoid MSYS slash conversion.
            # Include both regular imports and delay-load dependencies.
            while IFS= read -r dep; do
              key=$(printf '%s' "$dep" | tr '[:upper:]' '[:lower:]')
              if [ -n "${seen[$key]:-}" ]; then continue; fi
              seen[$key]=1
              src=$(resolve "$dep") || {
                if [[ "$key" == api-ms-* || "$key" == ext-ms-* ]] || [ -f "$(cygpath -S)/$dep" ]; then continue; fi
                echo "::error::unresolved non-system DLL $dep imported by $f"; exit 1
              }
              copy_once "$src"
              todo+=("stage/bin/$(basename "$src")")
            done < <(dumpbin -nologo -dependents "$f" \
                       | grep -oiE '^[[:space:]]+[A-Za-z0-9_.+-]+\.dll$' \
                       | awk '{print $1}')
          done

          # Include dynamically loaded provider libraries only when their loader is present.
          carry() {
            local d m n=0
            for d in "${PREFIXES[@]}"; do
              [ -d "$d" ] || continue
              while IFS= read -r m; do copy_once "$m"; n=$((n + 1)); done \
                < <(find "$d" -maxdepth 1 -iname "$1")
            done
            echo "carried $n file(s) for $1"
          }
          if find stage/bin -maxdepth 1 -iname 'onnxruntime*' | grep -q .; then
            carry 'onnxruntime_providers_*.dll'
          fi
          # The MKL dispatcher loads CPU-specific kernels at runtime.
          if find stage/bin -maxdepth 1 -iname 'mkl_rt*' | grep -q .; then
            carry 'mkl_*.dll'
          fi

          # Generate a real library with only the bundle and Windows on PATH.
          # Resolve Windows system directories through cygpath.
          BARE_PATH="$(cygpath -u "$PWD")/stage/bin:$(cygpath -S)"
          run_bare() {
            env -i SystemRoot="$(cygpath -w "$(cygpath -W)")" \
                TEMP="${TEMP:-C:/Windows/Temp}" TMP="${TMP:-C:/Windows/Temp}" \
                PATH="$BARE_PATH" \
                "$PWD/stage/bin/DIALibGen.exe" "$@"
          }
          run_bare --help > portable.txt 2>&1 \
            || { echo "::error::the staged bundle is not portable"; cat portable.txt; exit 1; }
          want=$(sed -n 's/^  VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ -n "$want" ] || { echo "::error::empty expected version"; exit 1; }
          grep -q "^Version: $want" portable.txt \
            || { echo "::error::the portable bundle reports the wrong version"; exit 1; }
          run_bare -in example/proteins.fasta -out portable.tsv > portable-run.txt 2>&1 \
            || { echo "::error::the staged bundle cannot generate a library"; cat portable-run.txt; exit 1; }
          [ "$(wc -l < portable.tsv)" -gt 1 ] \
            || { echo "::error::the staged bundle produced an empty library"; exit 1; }
          echo "portable bundle: $(find stage/bin -iname '*.dll' | wc -l) DLLs, $(du -sm stage | cut -f1) MB"

      - name: Exercise all relocated modes in a bare environment
        if: steps.pkg.outputs.package == 'true'
        shell: bash -el {0}
        run: |
          if [ -e stage/include ] || [ -e stage/lib/cmake ] || [ -e stage/bin/dialibgen-fetch-models ]; then
            echo "::error::the portable application contains development files"; exit 1
          fi
          if find stage/lib -type f \( -name '*.a' -o -name '*.lib' \) | grep -q .; then
            echo "::error::the portable application contains development libraries"; exit 1
          fi
          "$CONDA_PYTHON" .github/release-smoke.py stage/bin/DIALibGen.exe --bare --output smoke-portable
          if find stage/bin -iname '*python*.dll' | grep -q .; then
            echo "::error::the C++ release unexpectedly depends on Python"; exit 1
          fi

      - name: Collect runtime notices and corresponding sources
        if: steps.pkg.outputs.package == 'true'
        timeout-minutes: 90
        shell: bash -el {0}
        run: |
          "$CONDA_PYTHON" .github/test-runtime-licenses.py
          "$CONDA_PYTHON" .github/windows-license-providers.py \
            --contrib contrib-build --contrib-revision "$CONTRIB_REV" \
            --openms openms-install --openms-revision "$OPENMS_SHA" \
            --qt "$QT_ROOT_DIR" --cache license-source-cache --out runtime-providers.json
          "$CONDA_PYTHON" .github/collect-runtime-licenses.py --stage stage \
            --conda-prefix "$CONDA_PREFIX" --torch-root libtorch-sdk \
            --providers runtime-providers.json --origins runtime-origins.tsv \
            --sources corresponding-sources --source-asset DIALibGen-sources-windows-x64.tar.gz
          mkdir -p corresponding-sources/build-instructions
          cp .github/workflows/windows.yml .github/fetch-libtorch.py corresponding-sources/build-instructions/
          cp LICENSE THIRD-PARTY-NOTICES.md corresponding-sources/

      - name: Package the CLI
        if: steps.pkg.outputs.package == 'true'
        shell: bash
        run: |
          (cd stage && 7z a -tzip ../DIALibGen-windows-x64.zip .)
          python - <<'PYZIP'
          import zipfile
          with zipfile.ZipFile('DIALibGen-windows-x64.zip') as archive:
              if 'bin/DIALibGen.exe' not in archive.namelist():
                  raise SystemExit('CLI archive does not contain bin/DIALibGen.exe at its root')
          PYZIP

      # Stage CLI resources before Tauri copies them into the app.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.pkg.outputs.gui == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      # Use PowerShell so Cargo finds MSVC link.exe instead of Git Bash's coreutils link.
      - name: Build the desktop app
        if: steps.pkg.outputs.gui == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $res = 'gui/src-tauri/resources/dialibgen'
          if (Test-Path $res) { Remove-Item -Recurse -Force $res }
          New-Item -ItemType Directory -Force -Path $res | Out-Null
          Copy-Item -Recurse -Force 'stage/*' $res
          if (-not (Test-Path "$res/bin/DIALibGen.exe")) {
            Write-Output '::error::the CLI was not staged into the app''s resources'
            exit 1
          }

          # Verify the linker before starting the Cargo build.
          $link = (Get-Command link.exe -ErrorAction SilentlyContinue).Source
          Write-Output "link.exe: $link"
          if (-not $link) { Write-Output '::error::no link.exe on PATH'; exit 1 }
          if ($link -match '\\Git\\usr\\bin\\') {
            Write-Output "::error::link.exe resolves to Git's coreutils ($link), not MSVC's"
            exit 1
          }

          Set-Location gui
          npm ci
          npm run tauri build

      - name: Collect desktop corresponding sources
        if: steps.pkg.outputs.gui == 'true'
        shell: bash -el {0}
        run: |
          "$CONDA_PYTHON" .github/collect-gui-sources.py \
            --inventory gui/src-tauri/resources/third-party-licenses/inventory.json \
            --sources corresponding-sources

      - name: Collect the installer
        if: steps.pkg.outputs.gui == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Use stable asset names expected by download links.
          mkdir -p dist-bundles
          n=0
          while IFS= read -r f; do
            case "$f" in
              *.msi) cp "$f" "dist-bundles/DIALibGen-gui-windows-x64.msi" ;;
              *-setup.exe) cp "$f" "dist-bundles/DIALibGen-gui-windows-x64-setup.exe" ;;
            esac
            n=$((n + 1))
          done < <(find gui/src-tauri/target/release/bundle \
                     \( -name '*.msi' -o -name '*-setup.exe' \) -type f)
          ls -la dist-bundles
          for asset in DIALibGen-gui-windows-x64.msi DIALibGen-gui-windows-x64-setup.exe; do
            test -s "dist-bundles/$asset" \
              || { echo "::error::missing desktop installer $asset"; exit 1; }
          done

      - name: Package corresponding sources
        if: steps.pkg.outputs.package == 'true'
        shell: bash
        run: tar -C corresponding-sources -czf DIALibGen-sources-windows-x64.tar.gz .

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: steps.pkg.outputs.package == 'true'
        with:
          name: bundles-windows-x64
          path: |
            DIALibGen-windows-x64.zip
            DIALibGen-sources-windows-x64.tar.gz
            dist-bundles/*

      - name: Attach to the release
        if: steps.pkg.outputs.release == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            DIALibGen-windows-x64.zip
            DIALibGen-sources-windows-x64.tar.gz
            dist-bundles/*
          fail_on_unmatched_files: true

      # Require every Windows asset by its published name.
      - name: Assert this workflow's assets are on the release
        if: steps.pkg.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          have=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                   --json assets -q '.assets[].name')
          echo "$have"
          missing=0
          for n in DIALibGen-windows-x64.zip \
                   DIALibGen-sources-windows-x64.tar.gz \
                   DIALibGen-gui-windows-x64.msi \
                   DIALibGen-gui-windows-x64-setup.exe; do
            printf '%s' "$have" | grep -qx "$n" \
              || { echo "::error::$n is not on $GITHUB_REF_NAME"; missing=1; }
          done
          exit $missing

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: smoke-windows-x64
          path: |
            build/Testing/Temporary/LastTest.log
            windows-reader-crash.txt
            smoke-installed/*.log
            smoke-installed/**/*.tune.json
            smoke-portable/*.log
            smoke-portable/**/*.tune.json
