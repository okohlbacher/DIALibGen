name: build

# Linux/macOS release builds use bioconda OpenMS; Windows builds it separately.
# Validate installed and relocated bundles, including all three modes.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Manual dry runs validate CLI/desktop packaging without publishing a release.
  workflow_dispatch:
    inputs:
      gui_dry_run:
        description: 'Build the desktop app without cutting a tag'
        type: boolean
        default: false
      cli_dry_run:
        description: 'Package and verify the CLI without building desktop installers or cutting a tag'
        type: boolean
        default: false

concurrency:
  # Give manual dispatches independent concurrency groups.
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  macos-startup:
    if: github.event_name == 'workflow_dispatch' && inputs.gui_dry_run
    uses: ./.github/workflows/macos-startup.yml
    permissions:
      actions: read
      contents: read

  macos-candidate-startup:
    needs: build
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.gui_dry_run || inputs.cli_dry_run)))
    uses: ./.github/workflows/macos-startup.yml
    with:
      candidate_run_id: ${{ format('{0}', github.run_id) }}
    permissions:
      actions: read
      contents: read

  build:
    name: ${{ matrix.name }}
    timeout-minutes: 240
    runs-on: ${{ matrix.runner }}
    # Release asset uploads require write permission; fork PR tokens remain read-only.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS needs llvm-openmp; Linux uses the GCC OpenMP runtime.
          - { name: linux-x64,   runner: ubuntu-24.04,     extra: "libtorch=2.10.0=cpu_generic* libblas=*=*openblas", wheel: false }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, extra: "libblas=*=*openblas", wheel: true }
          - { name: macos-arm64, runner: macos-14,         extra: "llvm-openmp libtorch=2.10.0=cpu*", wheel: false }
          - { name: macos-x64,   runner: macos-15-intel,   extra: "llvm-openmp libtorch=2.10.0=cpu_generic* libblas=*=*openblas", wheel: false }

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Boost headers and Qt are required by OpenMS public interfaces.
      # Python dependencies are only for reference tests, whose registration is checked.
      # Let OpenMS constrain Arrow. Keep comments outside the folded create-args scalar.
      - name: Install OpenMS, ONNX Runtime and the toolchain
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: dialibgen
          create-args: >-
            openms=3.5.0
            onnxruntime-cpp
            libparquet
            libarrow-dataset
            libarrow-acero
            nlohmann_json
            xerces-c
            libsvm
            eigen
            zlib
            bzip2
            libzip
            hdf5
            libcurl
            libboost-devel
            glpk
            coin-or-cbc
            coin-or-utils
            qt6-main
            cmake
            ninja
            cxx-compiler
            python
            pyyaml
            numpy
            pyarrow
            onnxruntime
            ${{ matrix.extra }}
          condarc: |
            channels:
              - conda-forge
              - bioconda
          init-shell: bash
          cache-environment: true

      # ARM uses the official wheel C++ SDK; other platforms use tested OpenBLAS builds.
      # Every release must pass both prediction parity and optimizer tests.
      - name: Restore the ARM libtorch SDK
        if: matrix.wheel
        id: torch-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: libtorch-sdk
          key: libtorch-cpu-2.14.0-linux-arm64-08894195-v3

      - name: Extract the ARM libtorch SDK
        if: matrix.wheel && steps.torch-cache.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: python .github/fetch-libtorch.py linux-arm64 libtorch-sdk

      - name: Locate libtorch
        shell: bash -el {0}
        run: |
          set -euo pipefail
          if [ "${{ matrix.wheel }}" = true ]; then
            torch_root="$PWD/libtorch-sdk"
            # Use one attributable GNU/OpenBLAS runtime throughout all build and scientific checks.
            # Torch's $ORIGIN RUNPATH must also find these dependencies without LD_LIBRARY_PATH.
            # Replace wheel duplicates with links whose resolved origins identify the conda packages.
            for runtime in libgomp.so.1 libgfortran.so.5 libopenblas.so.0; do
              test -f "$CONDA_PREFIX/lib/$runtime" \
                || { echo "::error::missing conda ARM runtime $runtime"; exit 1; }
              rm -f "$torch_root/lib/$runtime"
              ln -s "$(readlink -f "$CONDA_PREFIX/lib/$runtime")" "$torch_root/lib/$runtime"
            done
            env -u LD_LIBRARY_PATH ldd "$torch_root/lib/libtorch_cpu.so" \
              | tee torch-runtime-dependencies.txt
            if grep -q 'not found' torch-runtime-dependencies.txt; then
              echo "::error::Torch has unresolved dependencies without LD_LIBRARY_PATH"; exit 1
            fi
            for runtime in libgomp.so.1 libgfortran.so.5 libopenblas.so.0; do
              resolved=$(awk -v name="$runtime" '$1 == name && $2 == "=>" {print $3}' torch-runtime-dependencies.txt)
              [ -n "$resolved" ] && [ "$(readlink -f "$resolved")" = "$(readlink -f "$CONDA_PREFIX/lib/$runtime")" ] \
                || { echo "::error::Torch did not select the conda runtime $runtime: $resolved"; exit 1; }
            done
          else
            torch_root="$CONDA_PREFIX"
          fi
          test -f "$torch_root/share/cmake/Torch/TorchConfig.cmake"
          {
            echo "TORCH_ROOT=$torch_root"
            echo "TORCH_DIR=$torch_root/share/cmake/Torch"
          } >> "$GITHUB_ENV"
          # Use conda's libgomp.so.1 consistently across OpenMS and the ARM SDK.
          echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib:$torch_root/lib" >> "$GITHUB_ENV"

      # Pinned stock models are required for prediction and training tests.
      - name: Restore the PeptDeep models
        id: cache-models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: models
          key: peptdeep-models-ccs41816f32-ms24141ea23-rt3f3b847e

      - name: Fetch the PeptDeep models
        if: steps.cache-models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          fetch() {
            curl -fsSL --retry 3 -o "models/$1" "https://archive.openms.de/openms/models/$1"
            echo "$2  models/$1" | shasum -a 256 -c -
          }
          # Keep model filenames and pinned hashes paired in ccs, ms2, rt order.
          fetch peptdeep_ccs_dynamic.onnx 41816f325cdd838897b7e7dcaf291da5d4d3903a1532fc5dc9db7e0725015801
          fetch peptdeep_ms2_dynamic.onnx 4141ea233d663b6f5b98ad80b8923ee685dae5cfdbe12243e2e30cd9c44ecf00
          fetch peptdeep_rt_dynamic.onnx  3f3b847ea37a9333ac163409f3d4b343d021471548091c61aed6cfa398ce62fd

      - name: Verify cached prediction models
        shell: bash
        run: bash scripts/fetch-models.sh --check --dir models

      - name: Configure
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # Native ARM conda Qt packages require QT_HOST_PATH to point to the same prefix.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DQT_HOST_PATH="$CONDA_PREFIX" \
            -DODIA_MODEL_DIR="$PWD/models" \
            -DDIALIBGEN_BUILD_FINETUNE=ON \
            -DTorch_DIR="$TORCH_DIR" \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage"

      - name: Build
        shell: bash -el {0}
        run: cmake --build build -j 2

      - name: Test
        shell: bash -el {0}
        run: |
          set -euo pipefail
          ctest --test-dir build -N > registered-tests.txt
          for name in tune_parity tune_e2e; do
            grep -Eq "[ :]+$name$" registered-tests.txt \
              || { echo "::error::$name is not registered; this release must include training"; exit 1; }
          done
          ctest --test-dir build --output-on-failure --timeout 2400 --output-junit "$PWD/build/ctest.xml"
          python - <<'PYTEST'
          import xml.etree.ElementTree as ET
          tests = {case.get("name"): case for case in ET.parse("build/ctest.xml").iter("testcase")}
          required = {
              "tune_parity", "tune_e2e", "tune_parameter_contract", "tune_training_contract", "e2e",
              "peptdeep_predictions_match_reference", "peptdeep_ccs_matches_reference",
              "peptdeep_ms2_matches_reference", "irt_calibration_matches_openms",
              "ms2_sessions_are_deterministic", "free_cysteine_correction", "decoy_methods_distinct",
              "library_io_contract", "text_writer_contract", "atomic_file_contract", "refinement_report_contract",
              "peptdeep_reference_encoding", "peptdeep_element_table", "peptdeep_meta_inputs",
              "peptdeep_encoder_matches_reference", "topp_parameters", "parameter_docs_current",
          }
          assert required <= tests.keys(), f"required tests missing: {required - tests.keys()}"
          for name, case in tests.items():
              assert case.find("skipped") is None, f"{name} must pass, not skip"
          PYTEST

      - name: Diagnose an ARM training failure
        if: failure() && !cancelled() && matrix.wheel
        shell: bash -el {0}
        run: |
          # Diagnostics never replace or relax the failed training gates above.
          timeout 90s bash <<'ARM_DIAG' || true
          set +e
          parity="$PWD/build/test/refinement/dialibgen_tune_parity"
          ldd "$parity"
          cat > /tmp/dialibgen-arm-lstm.cpp <<'CPP'
          #include <torch/torch.h>
          #include <iostream>
          int main(int argc, char**)
          {
            torch::set_num_threads(1);
            if (argc > 1) { at::globalContext().setUserEnabledMkldnn(false); }
            torch::nn::LSTM model(torch::nn::LSTMOptions(140, 128).num_layers(2).bidirectional(true).batch_first(true));
            auto state = std::make_tuple(torch::zeros({4, 1, 128}), torch::zeros({4, 1, 128}));
            std::cout << "LSTM forward" << std::endl;
            auto output = std::get<0>(model->forward(torch::randn({1, 8, 140}), state));
            std::cout << "LSTM backward" << std::endl;
            output.sum().backward();
            std::cout << "LSTM passed" << std::endl;
          }
          CPP
          "$CXX" -std=c++23 -O0 /tmp/dialibgen-arm-lstm.cpp \
            -I "$TORCH_ROOT/include" -I "$TORCH_ROOT/include/torch/csrc/api/include" \
            -L "$TORCH_ROOT/lib" -Wl,-rpath,"$TORCH_ROOT/lib" \
            -ltorch -ltorch_cpu -lc10 -o /tmp/dialibgen-arm-lstm
          if [ -x /tmp/dialibgen-arm-lstm ]; then
            ldd /tmp/dialibgen-arm-lstm
            for mode in default no-mkldnn; do
              arg=(); [ "$mode" = default ] || arg=(no-mkldnn)
              echo "Torch-only: $mode, conda first"
              timeout 8s /tmp/dialibgen-arm-lstm "${arg[@]}"; echo "exit=$?"
              echo "Torch-only: $mode, SDK first"
              LD_LIBRARY_PATH="$TORCH_ROOT/lib:$CONDA_PREFIX/lib" timeout 8s /tmp/dialibgen-arm-lstm "${arg[@]}"; echo "exit=$?"
              echo "ORT preloaded: $mode"
              LD_PRELOAD="$CONDA_PREFIX/lib/libonnxruntime.so" timeout 8s /tmp/dialibgen-arm-lstm "${arg[@]}"; echo "exit=$?"
            done
          fi
          if command -v gdb >/dev/null; then
            timeout 20s gdb -batch -ex run -ex 'thread apply all bt 12' -ex 'info sharedlibrary' \
              --args "$parity" "$PWD/models/peptdeep_rt_dynamic.onnx" "$PWD/models/peptdeep_ccs_dynamic.onnx"
          fi
          ARM_DIAG

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: tests-${{ matrix.name }}
          path: build/Testing/Temporary/LastTest.log

      - name: Install
        shell: bash -el {0}
        run: cmake --install build

      # Installed-tree checks use an empty environment with explicit runtime dependencies.
      - name: Verify installed CMake libraries
        shell: bash -el {0}
        run: |
          cmake -S test/consumer -B consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/stage;$CONDA_PREFIX" \
            -DQT_HOST_PATH="$CONDA_PREFIX" -DTorch_DIR="$TORCH_DIR"
          cmake --build consumer -j 2
          ctest --test-dir consumer --output-on-failure

      - name: The installed binary stands on its own
        shell: bash -el {0}
        run: |
          set -euo pipefail
          BIN="$PWD/stage/bin/DIALibGen"
          test -x "$BIN" || { echo "::error::no installed binary at $BIN"; exit 1; }

          # Require data at the path resolved relative to the installed executable.
          test -s "$PWD/stage/share/DIALibGen/irt_standards.tsv" \
            || { echo "::error::the iRT standards are not in the install tree"; exit 1; }

          # Require all three bundled prediction models.
          for m in peptdeep_rt_dynamic.onnx peptdeep_ms2_dynamic.onnx peptdeep_ccs_dynamic.onnx; do
            test -s "$PWD/stage/share/DIALibGen/models/$m" \
              || { echo "::error::$m is not in the install tree"; exit 1; }
          done

          export OPENMS_DATA_PATH="$CONDA_PREFIX/share/OpenMS"
          export DYLD_FALLBACK_LIBRARY_PATH="$CONDA_PREFIX/lib"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$TORCH_ROOT/lib"
          bash test/standalone_test.sh "$BIN" \
            "$(sed -n 's/^  VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" \
            example/proteins.fasta
          bash test/write_ctd_test.sh "$BIN"

      # Generate both library formats using the installed binary and real models.
      - name: Build a real library
        shell: bash -el {0}
        run: |
          set -euo pipefail
          export OPENMS_DATA_PATH="$CONDA_PREFIX/share/OpenMS"
          # Leave DIALIBGEN_MODEL_DIR unset to verify bundled-model discovery.
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$TORCH_ROOT/lib"
          export DYLD_FALLBACK_LIBRARY_PATH="$CONDA_PREFIX/lib"
          BIN="$PWD/stage/bin/DIALibGen"

          "$BIN" -in example/proteins.fasta -out out.parquet
          "$BIN" -in example/proteins.fasta -out out.tsv

          test -s out.parquet || { echo "::error::no Parquet library"; exit 1; }
          test -s out.tsv     || { echo "::error::no TSV library"; exit 1; }

          # Require nonempty Parquet output with embedded configuration.
          python - <<'PY'
          import pyarrow.parquet as pq, json, sys
          f = pq.ParquetFile("out.parquet")
          n = f.metadata.num_rows
          if n == 0:
              sys.exit("::error::the Parquet library has no rows")
          md = f.schema_arrow.metadata or {}
          raw = md.get(b"odia.config_json")
          if not raw:
              sys.exit("::error::the Parquet library does not carry odia.config_json")
          cfg = json.loads(raw)
          for k in ("enzyme", "fixed_modifications", "schema_version"):
              if k not in cfg:
                  sys.exit(f"::error::the embedded recipe is missing {k!r}")
          # Compact Parquet has one row per precursor and fragments in list columns.
          print(f"library: {n} precursors, recipe embedded ({len(cfg)} keys)")
          PY

          # The TSV is the DIA-NN dialect: a header and at least one row.
          rows=$(wc -l < out.tsv)
          [ "$rows" -gt 1 ] || { echo "::error::the TSV library has no rows"; exit 1; }
          # Require DIA-NN column spellings (DIANNLibraryFile::Columns).
          for col in Precursor.Id Modified.Sequence Precursor.Mz Product.Mz \
                     Relative.Intensity Fragment.Type Protein.Group; do
            head -1 out.tsv | tr '\t' '\n' | grep -qxF "$col" \
              || { echo "::error::the TSV header has no $col column"; exit 1; }
          done
          echo "tsv: $((rows - 1)) rows"

      - name: Exercise all installed modes
        shell: bash -el {0}
        run: python .github/release-smoke.py stage/bin/DIALibGen --output smoke-installed

      # Package on tags or manual dry runs; only tag events upload release assets.
      - name: Decide whether to package
        id: pkg
        shell: bash
        run: |
          # Check event_name first so a manual dispatch against a tag cannot publish.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "gui=${{ inputs.gui_dry_run }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.cli_dry_run }}" = "true" ] || [ "${{ inputs.gui_dry_run }}" = "true" ]; then
              echo "package=true" >> "$GITHUB_OUTPUT"
            else
              echo "package=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            printf '%s\n' package=true release=true gui=true >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' package=false release=false gui=false >> "$GITHUB_OUTPUT"
          fi

      # Dependency install scripts run before signing material is imported.
      - name: Install desktop dependencies
        if: steps.pkg.outputs.gui == 'true'
        working-directory: gui
        run: npm ci

      # Developer ID signing and notarization require secrets.
      # Forks and unsigned builds retain ad-hoc signing.
      - name: Decide whether to sign
        id: sign
        if: runner.os == 'macOS' && steps.pkg.outputs.package == 'true'
        shell: bash
        # Map secrets through env; step conditions cannot refer directly to secrets.
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          NOTARY: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_ID: ${{ secrets.MACOS_APPLE_ID }}
          NOTARY_TEAM: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CERT" ]; then
            echo "::notice::no MACOS_CERTIFICATE_BASE64 -- macOS artefacts stay ad-hoc signed"
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sign=true" >> "$GITHUB_OUTPUT"
          # Enable notarization only when all three credentials are present.
          if [ -n "$NOTARY" ] && [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_TEAM" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            [ -z "$NOTARY" ] || echo "::warning::MACOS_NOTARY_PASSWORD is set but MACOS_APPLE_ID/MACOS_TEAM_ID are not"

            # Report the incomplete signing/notarization configuration explicitly.
            echo "::warning::signing without notarizing -- Gatekeeper still refuses these"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the Developer ID certificate
        id: signing
        if: steps.sign.outputs.sign == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # Use a random password when none is provided for this temporary keychain.
          KCPW="${MACOS_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          echo "::add-mask::$KCPW"
          # Use an ephemeral keychain to avoid prompts from the locked login keychain.
          KC="$RUNNER_TEMP/dialibgen-signing.keychain-db"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          rm -f "$RUNNER_TEMP/cert.p12"
          # Authorize codesign without an interactive keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KCPW" "$KC" > /dev/null
          keychains=()
          while IFS= read -r keychain; do keychains+=("$keychain"); done \
            < <(security list-keychains -d user | sed 's/^ *"//; s/"$//')
          security list-keychain -d user -s "$KC" "${keychains[@]}"
          security default-keychain -d user -s "$KC"

          # Check the configured identity against the imported certificate.
          IDENT=$(security find-identity -p codesigning -v "$KC" \
                    | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$IDENT" ] || {
            security find-identity -p codesigning -v "$KC"
            echo "::error::no Developer ID Application identity in the imported certificate"
            echo "::error::Apple Development and Apple Distribution certificates sit next to it in the portal and cannot sign for distribution outside the App Store"
            exit 1
          }
          if [ -n "$MACOS_SIGNING_IDENTITY" ] && [ "$MACOS_SIGNING_IDENTITY" != "$IDENT" ]; then
            echo "::error::MACOS_SIGNING_IDENTITY does not match the imported certificate ($IDENT)"
            exit 1
          fi
          # Only non-secret references cross the step boundary.
          echo "identity=$IDENT" >> "$GITHUB_OUTPUT"
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"
          echo "signing as: $IDENT"

      # Collect dependency libraries and rewrite load paths for a relocatable bundle.
      - name: Make the install tree portable
        if: steps.pkg.outputs.package == 'true'
        # Bound dependency collection to detect hung tools.
        timeout-minutes: 20
        shell: bash -el {0}
        env:
          MACOS_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          MACOS_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          set -euo pipefail
          # Source installs retain the SDK; portable applications carry only runtime files.
          rm -rf stage/include stage/lib/cmake stage/lib/*.a stage/bin/dialibgen-fetch-models
          mkdir -p stage/lib
          : > runtime-origins.tsv
          # Bundle OpenMS data so relocated binaries do not require the build prefix.
          mkdir -p stage/share/OpenMS
          cp -R "$CONDA_PREFIX/share/OpenMS/." stage/share/OpenMS/

          if [ "$RUNNER_OS" = "macOS" ]; then
            # Resolve conda @rpath dependencies explicitly with noninteractive system tools.
            copy_closure() {
              otool -L "$1" | tail -n +2 | awk '{print $1}' | while read -r dep; do
                case "$dep" in
                  /usr/lib/*|/System/*) continue ;;
                esac
                base=$(basename "$dep")
                # Resolve build-time loader-relative dependencies against their known prefixes.
                src="$dep"
                case "$dep" in
                  @*)
                    src="$CONDA_PREFIX/lib/$base"
                    [ -f "$src" ] || src="$TORCH_ROOT/lib/$base"
                    ;;
                esac
                [ -f "$src" ] || { echo "::error::unresolved in $1: $dep"; exit 1; }
                if [ ! -f "stage/lib/$base" ]; then
                  cp "$src" "stage/lib/$base"
                  printf 'lib/%s\t%s\n' "$base" "$src" >> runtime-origins.tsv
                  echo "bundled lib/$base from $src"
                fi
              done
            }
            copy_closure stage/bin/DIALibGen
            prev=0
            for _ in 1 2 3 4 5 6 7 8; do
              n=$(find stage/lib -type f | wc -l)
              [ "$n" -eq "$prev" ] && break
              prev=$n
              for dy in stage/lib/*.dylib; do copy_closure "$dy"; done
            done

            # Use bundle-relative load commands and library IDs.
            retarget() {
              otool -L "$1" | tail -n +2 | awk '{print $1}' | while read -r dep; do
                case "$dep" in
                  /usr/lib/*|/System/*) continue ;;
                esac
                base=$(basename "$dep")
                [ -f "stage/lib/$base" ] || continue
                install_name_tool -change "$dep" "@executable_path/../lib/$base" "$1"
              done
            }
            retarget stage/bin/DIALibGen
            for dy in stage/lib/*.dylib; do
              install_name_tool -id "@executable_path/../lib/$(basename "$dy")" "$dy"
              retarget "$dy"
            done
            # Re-sign every modified Mach-O. Developer ID builds also require
            # hardened runtime and timestamps for notarization.
            if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
              sign() { codesign --force --timestamp --options runtime \
                         --keychain "$MACOS_KEYCHAIN" --sign "$MACOS_SIGN_IDENTITY" "$@"; }
            else
              sign() { codesign --force --sign - "$@"; }
            fi
            for dy in stage/lib/*.dylib; do sign "$dy"; done
            sign stage/bin/DIALibGen
            codesign --verify --strict --verbose=2 stage/bin/DIALibGen
          else
            # Resolve the complete dependency closure using the build runtime prefixes.
            # Copied conda RPATHs alone do not resolve libraries from stage/lib.
            export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$TORCH_ROOT/lib"
            copy_closure() {
              local missing
              missing=$(ldd "$1" | awk '/not found/{print $1}')
              [ -z "$missing" ] || { echo "::error::unresolved in $1: $missing"; exit 1; }
              ldd "$1" | awk '/=> \//{print $3}' | while read -r so; do
                case "$so" in
                  /lib/*|/lib64/*|/usr/lib/*|*/ld-linux*) continue ;;
                esac
                base=$(basename "$so")
                if [ ! -f "stage/lib/$base" ]; then
                  cp "$so" "stage/lib/$base"
                  printf 'lib/%s\t%s\n' "$base" "$so" >> runtime-origins.tsv
                  echo "bundled lib/$base from $so"
                fi
              done
            }
            copy_closure stage/bin/DIALibGen
            # Repeat until no dependency adds another library.
            prev=0
            for _ in 1 2 3 4 5 6 7 8; do
              n=$(find stage/lib -type f | wc -l)
              [ "$n" -eq "$prev" ] && break
              prev=$n
              for so in stage/lib/*.so*; do copy_closure "$so"; done
            done
            # shellcheck disable=SC2016
            patchelf --set-rpath '$ORIGIN/../lib' stage/bin/DIALibGen
            readelf -n stage/bin/DIALibGen | grep -qE 'Build ID: [0-9a-f]{40}' \
              || { echo "::error::Linux CLI lacks its GNU build ID after relocation"; exit 1; }
            # shellcheck disable=SC2016
            for so in stage/lib/*.so*; do patchelf --set-rpath '$ORIGIN' "$so"; done
          fi

          # Verify portability without build-environment paths.
          env -i HOME="$HOME" "$PWD/stage/bin/DIALibGen" --help > portable.txt 2>&1 \
            || { echo "::error::the staged bundle is not portable"; cat portable.txt; exit 1; }
          want=$(sed -n 's/^  VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ -n "$want" ] || { echo "::error::empty expected version"; exit 1; }
          grep -q "^Version: $want" portable.txt \
            || { echo "::error::the portable bundle reports the wrong version"; exit 1; }
          test -s stage/share/DIALibGen/irt_standards.tsv
          test -s stage/share/DIALibGen/models/peptdeep_ms2_dynamic.onnx \
            || { echo "::error::the staged bundle carries no models"; exit 1; }
          # OpenMS identifies its data directory by CHEMISTRY/unimod.xml.
          test -s stage/share/OpenMS/CHEMISTRY/unimod.xml \
            || { echo "::error::the staged tree is not a valid OpenMS data path"; exit 1; }

          # Generate a real library to exercise models, Arrow and OpenMS data.
          env -i HOME="$HOME" \
              "$PWD/stage/bin/DIALibGen" \
              -in example/proteins.fasta -out portable.tsv > portable-run.txt 2>&1 \
            || { echo "::error::the staged bundle cannot generate a library"; cat portable-run.txt; exit 1; }
          [ "$(wc -l < portable.tsv)" -gt 1 ] \
            || { echo "::error::the staged bundle produced an empty library"; exit 1; }
          echo "portable bundle ok: $(find stage/lib -name '*.so*' -o -name '*.dylib' | wc -l) libraries"

      # Submit a ZIP for notarization; Apple records the signed code hashes.
      # The distributed tarball cannot carry a stapled ticket.
      - name: Exercise all relocated modes in a bare environment
        if: steps.pkg.outputs.package == 'true'
        shell: bash -el {0}
        run: |
          if [ -e stage/include ] || [ -e stage/lib/cmake ] || [ -e stage/bin/dialibgen-fetch-models ]; then
            echo "::error::the portable application contains development files"; exit 1
          fi
          if find stage/lib -type f \( -name '*.a' -o -name '*.lib' \) | grep -q .; then
            echo "::error::the portable application contains development libraries"; exit 1
          fi
          python .github/release-smoke.py stage/bin/DIALibGen --bare --output smoke-portable
          if find stage/lib -iname '*python*' | grep -q .; then
            echo "::error::the C++ release unexpectedly depends on Python"; exit 1
          fi

      - name: Notarize the CLI
        if: steps.sign.outputs.notarize == 'true'
        timeout-minutes: 60
        shell: bash
        env:
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent stage "$RUNNER_TEMP/cli.zip"
          # The helper fetches the rejection log when notarization fails.
          bash .github/notarize.sh "$RUNNER_TEMP/cli.zip"

      - name: Collect runtime notices and corresponding sources
        if: steps.pkg.outputs.package == 'true'
        timeout-minutes: 90
        shell: bash -el {0}
        run: |
          python .github/test-runtime-licenses.py
          python .github/collect-runtime-licenses.py --stage stage \
            --conda-prefix "$CONDA_PREFIX" --torch-root "$TORCH_ROOT" \
            --origins runtime-origins.tsv --sources corresponding-sources \
            --source-asset "DIALibGen-sources-${{ matrix.name }}.json"
          mkdir -p corresponding-sources/build-instructions
          cp .github/workflows/ci.yml .github/fetch-libtorch.py corresponding-sources/build-instructions/
          cp LICENSE THIRD-PARTY-NOTICES.md corresponding-sources/

      - name: Package the CLI
        if: steps.pkg.outputs.package == 'true'
        shell: bash -el {0}
        run: tar -C stage -czf "DIALibGen-${{ matrix.name }}.tar.gz" .

      # Stage CLI resources before Tauri copies them. Use a non-login shell and
      # remove conda from PATH so Cargo links against the system webview libraries.
      - name: Build the desktop app
        if: steps.pkg.outputs.gui == 'true'
        # Allow for notarization latency while bounding the desktop build.
        timeout-minutes: 90
        shell: bash
        # The certificate is already in the temporary keychain. Tauri needs
        # only the identity and, for notarization, these step-scoped credentials.
        env:
          MACOS_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          MACOS_APPLE_ID: ${{ steps.sign.outputs.notarize == 'true' && secrets.MACOS_APPLE_ID || '' }}
          MACOS_TEAM_ID: ${{ steps.sign.outputs.notarize == 'true' && secrets.MACOS_TEAM_ID || '' }}
          MACOS_NOTARY_PASSWORD: ${{ steps.sign.outputs.notarize == 'true' && secrets.MACOS_NOTARY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v micromamba | paste -sd: -)
          export PATH
          if [ "$RUNNER_OS" = "Linux" ]; then
            # GTK/WebKit and their deploy tools must use the matching Ubuntu libraries.
            unset LD_LIBRARY_PATH
            sudo apt-get update
            # AppImage packaging requires xdg-utils and file on both Linux architectures.
            sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
              librsvg2-dev patchelf libgtk-3-dev xdg-utils file \
              desktop-file-utils
          fi
          rm -rf gui/src-tauri/resources/dialibgen
          mkdir -p gui/src-tauri/resources/dialibgen
          cp -R stage/. gui/src-tauri/resources/dialibgen/
          test -x gui/src-tauri/resources/dialibgen/bin/DIALibGen \
            || { echo "::error::the CLI was not staged into the app's resources"; exit 1; }
          cd gui
          # Empty APPLE_* values count as set to Tauri; export only usable values.
          if [ -n "$MACOS_SIGN_IDENTITY" ]; then
            export APPLE_SIGNING_IDENTITY="$MACOS_SIGN_IDENTITY"
          fi
          if [ -n "$MACOS_NOTARY_PASSWORD" ]; then
            export APPLE_ID="$MACOS_APPLE_ID" APPLE_PASSWORD="$MACOS_NOTARY_PASSWORD" \
              APPLE_TEAM_ID="$MACOS_TEAM_ID"
          fi
          # DEB keeps the complete resources; AppImage collects its GUI dependencies separately.
          # Positional arguments allow an empty list under macOS Bash 3.2 + nounset.
          set --
          if [ "$RUNNER_OS" = "Linux" ]; then set -- --bundles deb; fi
          # Keep verbose bundler diagnostics. Retry once after detaching transient DMG mounts.
          npm run tauri build -- "$@" || {
            echo "::warning::tauri build failed -- retrying once, verbosely"
            if [ "$RUNNER_OS" = "macOS" ]; then
              hdiutil info | awk '/\/Volumes\/DIALibGen/{print $1}' \
                | xargs -r -n1 hdiutil detach -force 2>/dev/null || true
            fi
            npm run tauri build -- --verbose "$@"
          }
          if [ "$RUNNER_OS" = "Linux" ]; then
            # linuxdeploy recursively scans usr/lib, including resource subdirectories.
            # Keep the private CLI out of that scan so its Conda libraries cannot replace GTK's.
            npm run tauri -- bundle --bundles appimage \
              --config '{"bundle":{"resources":["resources/third-party-licenses"]}}'
          fi

      - name: Collect desktop corresponding sources
        if: steps.pkg.outputs.gui == 'true'
        shell: bash -el {0}
        run: |
          python .github/collect-gui-sources.py \
            --inventory gui/src-tauri/resources/third-party-licenses/inventory.json \
            --sources corresponding-sources

      # Use stable asset names expected by the README and Homebrew casks.
      - name: Collect the desktop bundles
        if: steps.pkg.outputs.gui == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-bundles
          n=0
          while IFS= read -r f; do
            ext="${f##*.}"
            cp "$f" "dist-bundles/DIALibGen-gui-${{ matrix.name }}.$ext"
            n=$((n + 1))
          done < <(find gui/src-tauri/target/release/bundle \
                     \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -type f)
          ls -la dist-bundles
          if [ "$RUNNER_OS" = "Linux" ]; then exts="AppImage deb"; else exts="dmg"; fi
          for ext in $exts; do
            test -s "dist-bundles/DIALibGen-gui-${{ matrix.name }}.$ext" \
              || { echo "::error::missing desktop $ext installer"; exit 1; }
          done

      - name: Bundle and verify AppImage notices and corresponding sources
        if: steps.pkg.outputs.gui == 'true' && runner.os == 'Linux'
        timeout-minutes: 90
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v micromamba | paste -sd: -)
          export PATH
          python3 .github/test-appimage-licenses.py
          python3 .github/test-appimage-helpers.py
          APPDIR="$PWD/gui/src-tauri/target/release/bundle/appimage/DIALibGen.AppDir"
          APPIMAGE="$PWD/dist-bundles/DIALibGen-gui-${{ matrix.name }}.AppImage"
          test -d "$APPDIR" && test -f "$APPIMAGE"
          CLI_RESOURCES="$APPDIR/usr/lib/DIALibGen/resources/dialibgen"
          test ! -e "$CLI_RESOURCES" \
            || { echo "::error::private CLI resources were present during linuxdeploy's scan"; exit 1; }
          mkdir -p "$CLI_RESOURCES"
          cp -a stage/. "$CLI_RESOURCES/"
          diff --no-dereference --brief --recursive stage "$CLI_RESOURCES"

          # The standalone output plugin only packs AppDir; invoking linuxdeploy again
          # would flatten the private CLI libraries into the GUI's dependency directory.
          PACKER="$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage"
          test -x "$PACKER" \
            || { echo "::error::the cached standalone AppImage output plugin is missing"; exit 1; }
          PACKER_CHECKSUM="$PWD/corresponding-sources/build-instructions/appimage-output-plugin.sha256"
          sha256sum "$PACKER" > "$PACKER_CHECKSUM"
          repack() {
            sha256sum --check "$PACKER_CHECKSUM"
            rm -f "$APPIMAGE"
            ARCH="$(uname -m)" OUTPUT="$APPIMAGE" APPIMAGE_EXTRACT_AND_RUN=1 \
              "$PACKER" --appimage-extract-and-run --appdir "$APPDIR"
            test -s "$APPIMAGE"
            diff --no-dereference --brief --recursive stage "$CLI_RESOURCES"
          }
          repack
          python3 .github/appimage-helper-providers.py \
            --appdir "$APPDIR" --appimage "$APPIMAGE" --tools "$HOME/.cache/tauri" \
            --output corresponding-sources/appimage-helper-providers.json
          python3 .github/collect-appimage-licenses.py \
            --appdir "$APPDIR" --appimage "$APPIMAGE" --baseline stage \
            --gui-binary gui/src-tauri/target/release/dialibgen-gui \
            --deb "dist-bundles/DIALibGen-gui-${{ matrix.name }}.deb" \
            --providers corresponding-sources/appimage-helper-providers.json \
            --sources corresponding-sources \
            --source-asset "DIALibGen-sources-${{ matrix.name }}.json" --prepare-notices
          # Add the exact discovered notices without another dependency scan.
          cp -a gui/src-tauri/resources/third-party-licenses/appimage \
            "$APPDIR/usr/lib/DIALibGen/resources/third-party-licenses/"
          repack
          python3 .github/appimage-helper-providers.py \
            --appdir "$APPDIR" --appimage "$APPIMAGE" --tools "$HOME/.cache/tauri" \
            --output corresponding-sources/appimage-helper-providers.json
          python3 .github/collect-appimage-licenses.py \
            --appdir "$APPDIR" --appimage "$APPIMAGE" --baseline stage \
            --gui-binary gui/src-tauri/target/release/dialibgen-gui \
            --deb "dist-bundles/DIALibGen-gui-${{ matrix.name }}.deb" \
            --providers corresponding-sources/appimage-helper-providers.json \
            --sources corresponding-sources \
            --source-asset "DIALibGen-sources-${{ matrix.name }}.json"
          # Exercise the unchanged private CLI in the verified final AppImage payload.
          "$MAMBA_ROOT_PREFIX/envs/dialibgen/bin/python" .github/release-smoke.py \
            "$APPDIR/usr/lib/DIALibGen/resources/dialibgen/bin/DIALibGen" \
            --bare --output smoke-appimage

      - name: Install and open the Linux desktop packages
        if: steps.pkg.outputs.gui == 'true' && runner.os == 'Linux'
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          sudo apt-get install -y xvfb xauth x11-utils dbus-x11
          /usr/bin/python3 .github/linux-desktop-smoke.py \
            --deb "dist-bundles/DIALibGen-gui-${{ matrix.name }}.deb" \
            --appdir gui/src-tauri/target/release/bundle/appimage/DIALibGen.AppDir \
            --python "$MAMBA_ROOT_PREFIX/envs/dialibgen/bin/python" \
            --output smoke-linux-desktop

      # Notarize and staple the DMG separately from the app it contains.
      - name: Notarize and staple the disk image
        if: steps.pkg.outputs.gui == 'true' && steps.sign.outputs.notarize == 'true'
        timeout-minutes: 60
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          MACOS_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="dist-bundles/DIALibGen-gui-${{ matrix.name }}.dmg"
          test -f "$DMG" || { echo "::error::no $DMG to notarize"; exit 1; }
          # Re-sign the final DMG with the configured identity.
          codesign --force --timestamp --keychain "$MACOS_KEYCHAIN" \
            --sign "$MACOS_SIGN_IDENTITY" "$DMG"
          bash .github/notarize.sh "$DMG"
          xcrun stapler staple "$DMG"

      # Check signature integrity and Gatekeeper acceptance.
      - name: The signed artefacts are what they claim to be
        if: steps.pkg.outputs.gui == 'true' && steps.sign.outputs.notarize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DMG="dist-bundles/DIALibGen-gui-${{ matrix.name }}.dmg"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"
          xcrun stapler validate "$DMG"
          codesign --verify --strict --verbose=2 stage/bin/DIALibGen

          # Validate the app's own stapled ticket, which must survive extraction from the DMG.
          # Check the source bundle used for the image; a missing ticket requires a rebuild.
          shopt -s nullglob
          apps=(gui/src-tauri/target/release/bundle/macos/*.app)
          [ "${#apps[@]}" -gt 0 ] \
            || { echo "::error::no .app bundle to validate"; exit 1; }
          xcrun stapler validate "${apps[0]}" || {
            echo "::error::the .app carries no notarization ticket -- Tauri's staple failed silently"
            echo "::error::re-run this job; the ticket is usually just not propagated yet"
            exit 1
          }

      - name: Package corresponding sources
        if: steps.pkg.outputs.package == 'true'
        shell: bash
        run: |
          python3 .github/test-source-archive.py
          tar -C corresponding-sources -czf "DIALibGen-sources-${{ matrix.name }}.tar.gz" .
          python3 .github/source-archive.py "DIALibGen-sources-${{ matrix.name }}.tar.gz"
          shasum -a 256 DIALibGen-${{ matrix.name }}.tar.gz DIALibGen-sources-${{ matrix.name }}.*
          if [ -d dist-bundles ]; then shasum -a 256 dist-bundles/*; fi

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: steps.pkg.outputs.package == 'true'
        with:
          name: bundles-${{ matrix.name }}
          path: |
            DIALibGen-${{ matrix.name }}.tar.gz
            DIALibGen-sources-${{ matrix.name }}.*
            dist-bundles/*

      - name: Attach to the release
        if: steps.pkg.outputs.release == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            DIALibGen-${{ matrix.name }}.tar.gz
            DIALibGen-sources-${{ matrix.name }}.*
            dist-bundles/*
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: |
            smoke-installed/*.log
            smoke-installed/**/*.tune.json
            smoke-portable/*.log
            smoke-portable/**/*.tune.json
            smoke-appimage/*.log
            smoke-appimage/**/*.tune.json
            smoke-linux-desktop/**/*.log
            smoke-linux-desktop/**/*.json

      - name: Preserve failed Linux bundle diagnostics
        if: failure() && steps.pkg.outputs.package == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaging-diagnostics
          dpkg-query -W > packaging-diagnostics/installed-packages.txt
          candidates=corresponding-sources/appimage/candidate-paths.txt
          if [ -s "$candidates" ]; then
            tar -czf packaging-diagnostics/attribution-originals.tar.gz -T "$candidates"
          fi
          if [ -f stage/bin/DIALibGen ]; then
            cp stage/bin/DIALibGen packaging-diagnostics/DIALibGen-before-bundling
          fi
          if [ -f gui/src-tauri/target/release/dialibgen-gui ]; then
            cp gui/src-tauri/target/release/dialibgen-gui packaging-diagnostics/dialibgen-gui
          fi

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure() && steps.pkg.outputs.package == 'true' && runner.os == 'Linux'
        with:
          name: packaging-diagnostics-${{ matrix.name }}
          compression-level: 0
          retention-days: 7
          path: |
            packaging-diagnostics/
            runtime-origins.tsv
            torch-runtime-dependencies.txt
            corresponding-sources/runtime-attribution-failure.json
            corresponding-sources/appimage/*.json
            corresponding-sources/appimage/*.txt
            corresponding-sources/appimage-helper-providers.json
            corresponding-sources/build-instructions/appimage-output-plugin.sha256
            dist-bundles/*.AppImage
            gui/src-tauri/target/release/bundle/appimage/*.AppImage

      # Remove the temporary keychain even after an earlier failure.
      - name: Delete the signing keychain
        if: always() && steps.sign.outputs.sign == 'true'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/dialibgen-signing.keychain-db" || true

  # Check every Unix release asset; windows.yml checks its own assets.
  release-complete:
    needs: build
    # Run the completeness gate even when a build leg fails.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Draft release metadata is visible only to writers.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Assert this workflow's assets are on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets > release-assets.json
          have=$(jq -r '.assets[].name' release-assets.json)
          echo "$have"
          missing=0
          for n in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            printf '%s' "$have" | grep -qx "DIALibGen-$n.tar.gz" \
              || { echo "::error::no CLI tarball for $n on $tag"; missing=1; }
            printf '%s' "$have" | grep -qx "DIALibGen-sources-$n.json" \
              || { echo "::error::no corresponding sources for $n on $tag"; missing=1; }
          done
          # Require the exact asset names used by download links.
          for n in macos-x64 macos-arm64; do
            printf '%s' "$have" | grep -qx "DIALibGen-gui-$n.dmg" \
              || { echo "::error::no desktop .dmg for $n on $tag"; missing=1; }
          done
          for n in linux-x64 linux-arm64; do
            for ext in AppImage deb; do
              printf '%s' "$have" | grep -qx "DIALibGen-gui-$n.$ext" \
                || { echo "::error::no $ext desktop bundle for $n on $tag"; missing=1; }
            done
          done
          [ "$missing" -eq 0 ] || exit "$missing"
          mkdir source-manifests
          for n in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "DIALibGen-sources-$n.json" --dir source-manifests
          done
          python3 .github/source-archive.py --verify-assets release-assets.json source-manifests/*.json

  # Run desktop checks on all three OSes without OpenMS or model dependencies.
  gui:
    if: github.event_name != 'workflow_dispatch' || !inputs.cli_dry_run || inputs.gui_dry_run
    name: gui-${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
        working-directory: gui
      - run: npm run typecheck
        working-directory: gui
      - run: npm run test:coverage
        working-directory: gui
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: frontend-coverage-${{ matrix.os }}
          path: gui/coverage/
      - run: npm run build
        working-directory: gui

      # Test the Rust command boundary and enforce warning-free clippy.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      # Tauri needs the system webview and its build dependencies on Linux.
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - run: npm run licenses
        working-directory: gui
      - run: cargo test
        working-directory: gui/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: gui/src-tauri
