<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="DIALibGen" description="Generate, refine and tune DIA spectral libraries.">
    <ITEM name="version" value="0.11.0" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;DIALibGen&apos;">
      <ITEM name="mode" value="generate" type="string" description="generate: FASTA to library; refine: apply observed values; tune: train RT/CCS models and re-predict the whole library." required="false" advanced="false" restrictions="generate,refine,tune" />
      <ITEM name="in" value="" type="input-file" description="Protein FASTA (generate) or spectral library (refine/tune)." required="false" advanced="false" supported_formats="*.fasta,*.parquet,*.tsv" />
      <ITEM name="out" value="" type="output-file" description="DIA-NN spectral library; Parquet embeds provenance." required="false" advanced="false" supported_formats="*.parquet,*.tsv" />
      <ITEM name="config" value="" type="input-file" description="Optional JSON configuration for the selected mode. Explicit CLI/INI generation settings override JSON." required="false" advanced="false" supported_formats="*.json" />
      <ITEM name="write_config" value="" type="output-file" description="Write the effective mode configuration and exit." required="false" advanced="false" supported_formats="*.json" />
      <ITEM name="irt_standards" value="" type="input-file" description="iRT calibration standards; defaults to the bundled table." required="false" advanced="false" supported_formats="*.tsv" />
      <ITEM name="ids" value="" type="input-file" description="DIA-NN report.parquet, or a pre-filtered library with -empirical_library. Modification names are canonicalised." required="false" advanced="false" supported_formats="*.parquet" />
      <ITEM name="out_report" value="" type="output-file" description="Per-axis residual report (TSV), measured BEFORE the overwrite." required="false" advanced="false" supported_formats="*.tsv" />
      <ITEM name="no_filter" value="false" type="bool" description="Keep precursors the reference did not identify; requires -no_write_rt or successful RT tuning so RT units stay consistent." required="false" advanced="false" />
      <ITEM name="empirical_library" value="false" type="bool" description="Declare -ids a pre-filtered empirical library rather than a report: gates whose columns are absent are BYPASSED and each bypass is recorded. Without this, a missing gate column is an error." required="false" advanced="false" />
      <ITEM name="no_write_rt" value="false" type="bool" description="Keep predicted RT rather than replacing it with observed RT." required="false" advanced="false" />
      <ITEM name="write_im" value="false" type="bool" description="Also overwrite 1/K0 with the observed value for charges &gt;= -im_min_charge; off by default." required="false" advanced="false" />
      <ITEM name="write_intensity" value="false" type="bool" description="Replace predicted fragment intensities with the reference run&apos;s observed ones. Needs Fragment.Info/Fragment.Quant.Raw (1.9) or Fr.N.Id/Quantity (2.x), exported with --report-lib-info or --export-quant respectively. Every match is cross-checked on fragment m/z, and a run that replaces nothing is an error." required="false" advanced="false" />
      <ITEM name="intensity_min_correlation" value="0.0" type="double" description="Require fragment quality greater than this: correlation in DIA-NN 1.9, Score in DIA-NN 2.x. -1 disables the quality gate." required="false" advanced="false" />
      <ITEM name="intensity_no_restrict" value="false" type="bool" description="Replace a precursor only when EVERY one of its transitions is trusted, else keep its predictions whole. Neutral-loss transitions cannot match report fragments, so precursors carrying them keep their predictions. Transition counts cannot change." required="false" advanced="false" />
      <ITEM name="intensity_no_rerank" value="false" type="bool" description="Keep a replaced precursor&apos;s transitions in their original order." required="false" advanced="false" />
      <ITEM name="intensity_min_fragments" value="3" type="int" description="A replaced precursor keeps at least this many transitions or keeps its predictions whole." required="false" advanced="false" restrictions="0:" />
      <ITEM name="intensity_norm" value="library_max" type="string" description="How an observed area becomes a library intensity. library_max scales to the maximum that precursor already held, which preserves the file&apos;s own convention -- base peak = 1 is not an invariant of these libraries." required="false" advanced="false" restrictions="library_max,base_peak,sum,raw" />
      <ITEM name="intensity_min_relative" value="1.0e-04" type="double" description="Drop observed intensities below this fraction of the kept maximum." required="false" advanced="false" />
      <ITEM name="intensity_mz_tol_ppm" value="20.0" type="double" description="A fragment matches only when the report&apos;s m/z agrees with the library&apos;s to within this." required="false" advanced="false" />
      <ITEM name="intensity_max_mz_mismatch" value="0.01" type="double" description="Refuse when more than this fraction of identity matches fail the m/z check. 1 surveys a suspect pairing instead of failing." required="false" advanced="false" />
      <ITEM name="allow_mixed_intensity" value="false" type="bool" description="Permit -write_intensity with -no_filter, which leaves observed and predicted intensities in one library. Recorded in the provenance." required="false" advanced="false" />
      <ITEM name="q_precursor" value="0.01" type="double" description="Precursor q-value gate (&gt;= 1 disables)." required="false" advanced="false" />
      <ITEM name="q_global" value="0.01" type="double" description="Global/peptide q-value gate (&gt;= 1 disables)." required="false" advanced="false" />
      <ITEM name="q_protein" value="0.01" type="double" description="Protein q-value gate (&gt;= 1 disables)." required="false" advanced="false" />
      <ITEM name="min_fragments" value="0" type="int" description="Minimum DISTINCT reference fragments per precursor; needs fragment identities in -ids. 0 = off." required="false" advanced="false" restrictions="0:" />
      <ITEM name="rt_unit" value="observed" type="string" description="observed = the reference&apos;s own units; minmax = rescaled to 0..100 over the matched set (refused with -no_filter)." required="false" advanced="false" restrictions="observed,minmax" />
      <ITEM name="dedup" value="lowest_q" type="string" description="Which observation wins when a precursor was seen more than once: lowest_q (ties: lower PEP, then first seen) or highest_evidence (needs an Evidence column)." required="false" advanced="false" restrictions="lowest_q,highest_evidence" />
      <ITEM name="im_min_charge" value="2" type="int" description="Charges below this never receive an observed 1/K0 (z1 is censored at the ramp top on timsTOF diaPASEF)." required="false" advanced="false" />
      <ITEM name="im_ramp_top" value="0.0" type="double" description="The instrument&apos;s mobility ramp top, if known; observations within -im_ramp_margin of it are treated as censored. 0 = unknown." required="false" advanced="false" />
      <ITEM name="im_ramp_margin" value="0.02" type="double" description="See -im_ramp_top." required="false" advanced="false" />
      <ITEM name="min_match_fraction" value="0.0" type="double" description="Refuse when fewer than this fraction of passing reference precursors match the library. 0 = refuse only when nothing matches." required="false" advanced="false" />
      <ITEM name="tune" value="false" type="bool" description="Fine-tune the RT and CCS models on -ids and re-predict the whole library through them BEFORE refining, so precursors the reference never identified are corrected too. Needs a build with the fine-tuning stage. Turns a seconds-long refinement into a training run plus whole-library inference." required="false" advanced="false" />
      <ITEM name="tune_models" value="" type="string" description="Directory holding the stock peptdeep_{rt,ccs}_dynamic.onnx. Default: $DIALIBGEN_MODEL_DIR or the bundled models." required="false" advanced="false" />
      <ITEM name="tune_heads" value="both" type="string" description="Which models to tune." required="false" advanced="false" restrictions="rt,ccs,both" />
      <ITEM name="tune_out_models" value="" type="string" description="Keep the tuned ONNX files and their .tune.json and .trajectory.tsv sidecars here. Default: a scratch directory, removed on exit -- the deliverable is the library." required="false" advanced="false" />
      <ITEM name="tune_predict_gpu" value="false" type="bool" description="Use the GPU for the re-prediction pass (the ONNX one, not training)." required="false" advanced="false" />
      <ITEM name="tune_predict_sessions" value="0" type="int" description="ONNX Runtime sessions for the re-prediction pass; 0 = default." required="false" advanced="false" restrictions="0:" />
      <ITEM name="tune_keep_free_cysteine_offset" value="false" type="bool" description="Keep DIALibGen&apos;s free-cysteine RT offset when re-predicting with a TUNED RT model. Off by default: that offset was fitted against the STOCK model, and a model tuned on this run&apos;s own identifications has had the chance to learn the effect itself -- applying both counts it twice." required="false" advanced="false" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
      <NODE name="generation" description="FASTA digestion, prediction and decoys.">
        <ITEM name="ccs_model" value="" type="string" description="ccs model" required="false" advanced="false" />
        <ITEM name="decoys" value="none" type="string" description="decoys" required="false" advanced="false" restrictions="none,mutate,pseudo_reverse,reverse,shuffle" />
        <ITEM name="derive_ion_mobility" value="true" type="string" description="derive ion mobility" required="false" advanced="false" restrictions="true,false" />
        <ITEM name="enzyme" value="Trypsin/P" type="string" description="enzyme" required="false" advanced="false" />
        <ITEMLIST name="fixed_modifications" type="string" description="fixed modifications" required="false" advanced="false">
          <LISTITEM value="Carbamidomethyl (C)"/>
        </ITEMLIST>
        <ITEMLIST name="fragment_mz" type="double" description="fragment mz" required="false" advanced="false">
          <LISTITEM value="200"/>
          <LISTITEM value="1800"/>
        </ITEMLIST>
        <ITEMLIST name="fragments" type="int" description="fragments" required="false" advanced="false">
          <LISTITEM value="3"/>
          <LISTITEM value="12"/>
        </ITEMLIST>
        <ITEM name="free_cysteine_rt_correction" value="true" type="string" description="free cysteine rt correction" required="false" advanced="false" restrictions="true,false" />
        <ITEM name="instrument" value="QE" type="string" description="instrument" required="false" advanced="false" />
        <ITEM name="irt_rescale" value="false" type="bool" description="irt rescale" required="false" advanced="false" />
        <ITEM name="max_fragment_charge" value="2" type="int" description="max fragment charge" required="false" advanced="false" restrictions="1:2" />
        <ITEM name="max_variable_modifications" value="1" type="int" description="max variable modifications" required="false" advanced="false" restrictions="0:" />
        <ITEM name="min_relative_intensity" value="1.0e-04" type="double" description="min relative intensity" required="false" advanced="false" restrictions="0.0:" />
        <ITEM name="missed_cleavages" value="1" type="int" description="missed cleavages" required="false" advanced="false" restrictions="0:" />
        <ITEM name="ms2_model" value="" type="string" description="ms2 model" required="false" advanced="false" />
        <ITEM name="n_terminal_methionine_excision" value="true" type="string" description="n terminal methionine excision" required="false" advanced="false" restrictions="true,false" />
        <ITEM name="nce" value="-1.0" type="double" description="Normalized collision energy (&gt;0 and &lt;=100). -1 selects the instrument default." required="false" advanced="false" restrictions="-1.0:100.0" />
        <ITEMLIST name="peptide_length" type="int" description="peptide length" required="false" advanced="false">
          <LISTITEM value="7"/>
          <LISTITEM value="30"/>
        </ITEMLIST>
        <ITEMLIST name="precursor_charges" type="int" description="precursor charges" required="false" advanced="false" restrictions="1:8">
          <LISTITEM value="1"/>
          <LISTITEM value="2"/>
          <LISTITEM value="3"/>
          <LISTITEM value="4"/>
        </ITEMLIST>
        <ITEMLIST name="precursor_mz" type="double" description="precursor mz" required="false" advanced="false">
          <LISTITEM value="350"/>
          <LISTITEM value="1200"/>
        </ITEMLIST>
        <ITEM name="recompute_decoy_mz" value="false" type="bool" description="recompute decoy mz" required="false" advanced="false" />
        <ITEM name="reserved_doubly_charged" value="0" type="int" description="reserved doubly charged" required="false" advanced="false" restrictions="0:" />
        <ITEM name="rt_model" value="" type="string" description="rt model" required="false" advanced="false" />
        <ITEMLIST name="variable_modifications" type="string" description="variable modifications" required="false" advanced="false">
        </ITEMLIST>
      </NODE>
      <NODE name="filter" description="Fine-tuning: which observations train the model. NOTE: this is the TRAINING-set filter, not the library filter -- that is -q_precursor and friends.">
        <ITEM name="q_value" value="0.01" type="double" description="Precursor Q.Value threshold" required="false" advanced="false" />
        <ITEM name="min_charge" value="2" type="int" description="CCS only: lowest precursor charge used (RT collapses all charges). z1 is censored at the mobility ramp top on timsTOF" required="false" advanced="false" restrictions="1:8" />
        <ITEM name="allow_z1" value="false" type="bool" description="CCS: permit filter:min_charge 1 (censored observations enter training)" required="false" advanced="false" />
        <ITEM name="rt_spread_max" value="0.2" type="double" description="Drop a sequence whose charge states&apos; RTs span more than this (minutes)" required="false" advanced="false" />
        <ITEM name="rt_max_minutes" value="0.0" type="double" description="rt_norm denominator; 0 = the run&apos;s maximum observed RT" required="false" advanced="false" />
      </NODE>
      <NODE name="cohort" description="Fine-tuning: protein-level cohorts (frozen before subsampling)">
        <ITEM name="train_size" value="0" type="int" description="Training units (sequences for rt, sequence x charge for ccs); 0 = full pool" required="false" advanced="false" restrictions="0:" />
        <ITEM name="train_frac" value="0.0" type="double" description="Alternative to train_size: fraction of the pool" required="false" advanced="false" />
        <ITEM name="full_fit" value="false" type="bool" description="Train on EVERY unit of the run, the test and validation cohorts included: the closest fit the data allows. val and TEST are then in-sample; judge this mode by searching a DIFFERENT run with the result, never by its own numbers" required="false" advanced="false" />
        <ITEM name="no_inner_val" value="false" type="bool" description="No inner validation cohort: its units rejoin the pool and checkpoints are selected on TEST, which is then no longer a held-out number" required="false" advanced="false" />
      </NODE>
      <NODE name="train" description="Fine-tuning: recipe">
        <ITEM name="epochs" value="100" type="int" description="Horizon of the cosine schedule (and the maximum epochs)" required="false" advanced="false" restrictions="1:" />
        <ITEM name="warmup" value="10" type="int" description="Linear warmup epochs" required="false" advanced="false" restrictions="0:" />
        <ITEM name="lr" value="1.0e-04" type="double" description="Peak learning rate (Adam)" required="false" advanced="false" />
        <ITEM name="batch_size" value="1024" type="int" description="Batch size within a length group" required="false" advanced="false" restrictions="1:" />
      </NODE>
      <NODE name="stop" description="Fine-tuning: convergence">
        <ITEM name="eval_every" value="1" type="int" description="Validate every n epochs" required="false" advanced="false" restrictions="1:" />
        <ITEM name="min_epochs" value="20" type="int" description="Never stop before this epoch" required="false" advanced="false" restrictions="0:" />
        <ITEM name="patience" value="10" type="int" description="Stop after this many epochs without progress (never before max(min_epochs, warmup))" required="false" advanced="false" restrictions="0:" />
        <ITEM name="rel_tol" value="5.0e-03" type="double" description="Progress = the selection metric beats the anchor by this fraction" required="false" advanced="false" />
        <ITEM name="abs_tol" value="0.0" type="double" description="Progress = beats the anchor by this absolute amount (0 = use rel_tol)" required="false" advanced="false" />
        <ITEM name="max_seconds" value="0.0" type="double" description="Wall-clock budget per head, checked at epoch boundaries; final evaluation/export may exceed it (0 = none)" required="false" advanced="false" />
        <ITEM name="select" value="calibrated_sd" type="string" description="Selection metric on the validation cohort" required="false" advanced="false" restrictions="calibrated_sd,rmse" />
      </NODE>
      <NODE name="machine" description="Fine-tuning: device">
        <ITEM name="device" value="cpu" type="string" description="cpu or cuda[:N]" required="false" advanced="false" />
        <ITEM name="threads" value="4" type="int" description="CPU threads used for training" required="false" advanced="false" restrictions="1:" />
        <ITEM name="no_cudnn" value="false" type="bool" description="CUDA: do not use cuDNN (needed when only its loader shim is installed, as in pytorch.org&apos;s libtorch zips); slower" required="false" advanced="false" />
        <ITEM name="seed" value="20260803" type="int" description="Seed for the training subsample and batch order" required="false" advanced="false" restrictions="0:" />
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>
