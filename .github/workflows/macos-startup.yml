name: macOS first-launch measurement

# Each route gets a fresh VM: Gatekeeper caches code-directory hashes globally.
# Never run DIALibGen or assess it with spctl before the timed first invocation.
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Build run containing bundles-macos-arm64; empty measures archived v0.10.1'
        type: string
        default: ''
  workflow_call:
    inputs:
      candidate_run_id:
        type: string
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        route: [tarball, cask]
        include:
          - route: tarball
            runner: macos-14
          - route: cask
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      ROUTE: ${{ matrix.route }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - name: Download the candidate payload without launching it
        if: inputs.candidate_run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: bundles-macos-arm64
          path: payload
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Install the candidate through tar or Homebrew defaults
        if: inputs.candidate_run_id != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import functools, http.server, json, os, pathlib, subprocess, threading, time
          out = pathlib.Path('measurements')
          out.mkdir()
          archive = pathlib.Path('payload/DIALibGen-macos-arm64.tar.gz').resolve()
          def checksum(path):
              return subprocess.check_output(['shasum', '-a', '256', str(path)], text=True).split()[0]
          digest = checksum(archive)
          route = os.environ['ROUTE']
          # Staging proxy only: both routes receive the identical CI archive.
          # Homebrew itself downloads, quarantines, extracts and wraps the cask.
          handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory=str(archive.parent))
          server = http.server.ThreadingHTTPServer(('127.0.0.1', 0), handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          url = f'http://127.0.0.1:{server.server_port}/{archive.name}'
          with (out / 'system.txt').open('w') as log:
              for command in (['sw_vers'], ['uname', '-a'], ['brew', '--version']):
                  subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, check=True)
          started = time.perf_counter()
          try:
              with (out / 'install.txt').open('w') as log:
                  def run(*args):
                      subprocess.run(args, stdout=log, stderr=subprocess.STDOUT, check=True)
                  if route == 'tarball':
                      installed = pathlib.Path('candidate').resolve()
                      installed.mkdir()
                      run('curl', '-fL', '--retry', '3', '-o', 'candidate.tar.gz', url)
                      assert checksum('candidate.tar.gz') == digest
                      run('tar', 'xzf', 'candidate.tar.gz', '-C', str(installed))
                      binary = installed / 'bin/DIALibGen'
                  else:
                      run('brew', 'tap-new', '--no-git', 'dialibgen/startup')
                      tap = pathlib.Path(subprocess.check_output(['brew', '--repository', 'dialibgen/startup'], text=True).strip())
                      (tap / 'Casks').mkdir(exist_ok=True)
                      (tap / 'Casks/dialibgen-candidate.rb').write_text(f'''cask "dialibgen-candidate" do
            version "0.11.0"
            sha256 "{digest}"
            url "{url}"
            name "DIALibGen release candidate"
            desc "DIA spectral library generation and refinement"
            homepage "https://github.com/okohlbacher/DIALibGen"
            depends_on macos: :sonoma
            command_wrapper "DIALibGen", executable: "#{{staged_path}}/bin/DIALibGen"
          end
          ''')
                      run('brew', 'install', '--cask', 'dialibgen/startup/dialibgen-candidate')
                      prefix = subprocess.check_output(['brew', '--prefix'], text=True).strip()
                      caskroom = subprocess.check_output(['brew', '--caskroom'], text=True).strip()
                      installed = pathlib.Path(caskroom) / 'dialibgen-candidate'
                      binary = pathlib.Path(prefix) / 'bin/DIALibGen'
              elapsed = time.perf_counter() - started
          finally:
              server.shutdown()
          record = {'route': route, 'source_run_id': os.environ['CANDIDATE_RUN_ID'],
                    'archive_sha256': digest, 'install_seconds': elapsed,
                    'delivery': 'same CI archive via localhost; unmodified Homebrew quarantine defaults'}
          (out / 'installation.json').write_text(json.dumps(record, indent=2) + '\n')
          print(record, flush=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'MEASURE_BINARY={binary}\nMEASURE_TREE={installed}\n')
          attrs = subprocess.run(['xattr', '-lr', str(installed)], capture_output=True, text=True)
          (out / 'xattrs-before.txt').write_text(attrs.stdout + attrs.stderr)
          if route == 'cask' and 'com.apple.quarantine' not in attrs.stdout:
              raise SystemExit('Homebrew did not quarantine the candidate; this cannot measure normal cask first launch')
          PY

      - name: Install the archived v0.10.1 payload without launching it
        if: inputs.candidate_run_id == ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p measurements
          sw_vers > measurements/system.txt
          uname -a >> measurements/system.txt
          if [ "$ROUTE" = tarball ]; then
            curl -fL --retry 3 -o archived.tar.gz \
              https://github.com/okohlbacher/DIALibGen/releases/download/v0.10.1/DIALibGen-macos-arm64.tar.gz
            echo '0dc1d9a8252b2cea3445c3c7f92ea33645347f0d1ea91074bf5a9e77643b6476  archived.tar.gz' | shasum -a 256 -c -
            mkdir archived
            tar xzf archived.tar.gz -C archived
            echo "MEASURE_BINARY=$PWD/archived/bin/DIALibGen" >> "$GITHUB_ENV"
            xattr -lr archived > measurements/xattrs-before.txt 2>&1 || true
          else
            # Pin the historical cask, including its version and both digests.
            brew tap okohlbacher/dialibrarygenerator
            tap_dir=$(brew --repository okohlbacher/dialibrarygenerator)
            git -C "$tap_dir" checkout e20ed6042c98a271b7c5afb7d78485086f7d41ab
            brew install --cask okohlbacher/dialibrarygenerator/dialibgen-cli \
              2>&1 | tee measurements/install.txt
            echo "MEASURE_BINARY=$(brew --prefix)/bin/DIALibGen" >> "$GITHUB_ENV"
            xattr -lr "$(brew --caskroom)/dialibgen-cli" > measurements/xattrs-before.txt 2>&1 || true
          fi

      - name: Time the first and second invocation
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          out = pathlib.Path('measurements')
          records = []
          for number in (1, 2):
              started = time.perf_counter()
              try:
                  run = subprocess.run([os.environ['MEASURE_BINARY'], '--help'], capture_output=True, timeout=900)
                  output, code = run.stdout + run.stderr, run.returncode
              except subprocess.TimeoutExpired as error:
                  output, code = (error.stdout or b'') + (error.stderr or b''), 124
              elapsed = time.perf_counter() - started
              (out / f'launch-{number}.log').write_bytes(output)
              records.append({'route': os.environ['ROUTE'], 'invocation': number, 'seconds': elapsed, 'exit_code': code})
              (out / 'timings.json').write_text(json.dumps(records, indent=2) + '\n')
              print(records[-1], flush=True)
              if code:
                  raise SystemExit(code)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('| Route | Invocation | Seconds |\n|---|---:|---:|\n')
              for r in records:
                  summary.write(f"| {r['route']} | {r['invocation']} | {r['seconds']:.3f} |\n")
              if os.environ['CANDIDATE_RUN_ID']:
                  install = json.loads((out / 'installation.json').read_text())
                  summary.write(f"\nFresh hosted VM; candidate from run {install['source_run_id']}; installation {install['install_seconds']:.3f} s.\n")
                  summary.write('Both routes use the identical artifact through a localhost staging proxy. Homebrew uses its normal cask installation and quarantine defaults; this excludes public GitHub download latency. No execution or policy assessment precedes the first timed launch, apart from any Homebrew installation checks.\n')
              else:
                  summary.write('\nFresh hosted VM; archived v0.10.1 ARM payload. Raw curl and Homebrew preserve their normal quarantine behavior; the artifact records attributes.\n')
          PY

      - name: Collect policy diagnostics after measurement
        if: always()
        shell: bash
        run: |
          /usr/bin/log show --last 30m --style compact \
            --predicate 'process == "syspolicyd"' > measurements/syspolicyd.log 2>&1 || true
          if [ -n "${MEASURE_BINARY:-}" ]; then
            shasum -a 256 "$MEASURE_BINARY" > measurements/launcher-sha256.txt
            if [ -n "${MEASURE_TREE:-}" ]; then
              find "$MEASURE_TREE" -type f -name DIALibGen -print -exec shasum -a 256 {} \; \
                > measurements/executable-sha256.txt
              find "$MEASURE_TREE" -type f -name DIALibGen -exec codesign -dv --verbose=4 {} \; \
                > measurements/signature.txt 2>&1 || true
              xattr -lr "$MEASURE_TREE" > measurements/xattrs-after.txt 2>&1 || true
            fi
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: startup-${{ inputs.candidate_run_id != '' && format('candidate-{0}', inputs.candidate_run_id) || 'v0.10.1' }}-${{ matrix.route }}
          path: measurements/
