name: build

# Linux x64/arm64 and macOS x64/arm64, tests included.
#
# OpenMS comes from bioconda, installed in seconds. Windows is a separate
# workflow (windows.yml) for the unrelated reason that bioconda has no win-64
# package and OpenMS has to be built from source there.
#
# The gates that matter are at the END, against the INSTALLED tree rather than
# the build tree: a tool that links OpenMS but is not part of it gets OpenMS's
# defaults for its version, its update check and its data lookup, and all three
# are wrong for it. Every one of those has shipped past a green pipeline in a
# sibling project, found only by installing the artefact and typing a command.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `extra` carries per-platform conda packages on top of the shared
          # set. macOS asks for llvm-openmp explicitly because Apple's clang
          # ships no OpenMP runtime; on Linux OpenMP comes from the gcc
          # toolchain and adding llvm-openmp risks clashing with libgomp.
          - { name: linux-x64,   runner: ubuntu-24.04,     extra: "" }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, extra: "" }
          - { name: macos-arm64, runner: macos-14,         extra: "llvm-openmp" }
          - { name: macos-x64,   runner: macos-15-intel,   extra: "llvm-openmp" }

    steps:
      - uses: actions/checkout@v5

      # libboost-devel and qt6-main are dependencies OpenMSConfig.cmake needs
      # but the openms package does not pull in:
      #   libboost-devel  OpenMS/config.h is public and #includes
      #                   <boost/current_function.hpp>, so every downstream
      #                   translation unit needs Boost headers
      #   qt6-main        OpenMSConfig.cmake does find_dependency(Qt6)
      #
      # python/numpy/pyarrow/onnxruntime are for the TESTS, not the tool: the
      # C++ encoder is checked against an independent Python reference written
      # from the same spec but from different inputs, so agreement is evidence
      # the spec was implemented rather than that one copied the other. Without
      # them those tests do not fail -- they are simply never added, which is
      # the quiet way a test suite shrinks.
      #
      # libarrow is deliberately NOT pinned: openms pins it itself, and this
      # project is built against whatever that resolves to. That is the point of
      # having dropped the Arrow >= 23 floor to the 19 the code actually needs.
      #
      # create-args is a FOLDED scalar: every line is joined into one command
      # line, so a `#` comment inside it becomes a literal argument. All prose
      # belongs up here.
      - name: Install OpenMS, ONNX Runtime and the toolchain
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: dialibgen
          create-args: >-
            openms=3.5.0
            onnxruntime-cpp
            libparquet
            libarrow-dataset
            libarrow-acero
            nlohmann_json
            xerces-c
            libsvm
            eigen
            zlib
            bzip2
            libzip
            hdf5
            libcurl
            libboost-devel
            glpk
            coin-or-cbc
            coin-or-utils
            qt6-main
            cmake
            ninja
            cxx-compiler
            python
            numpy
            pyarrow
            onnxruntime
            ${{ matrix.extra }}
          condarc: |
            channels:
              - conda-forge
              - bioconda
          init-shell: bash
          cache-environment: true

      # The three AlphaPeptDeep exports. They are NOT shipped with this project
      # and NOT in any tagged OpenMS release, so without this step every
      # prediction test and the end-to-end run below are silently skipped -- CI
      # would prove the tool compiles and nothing about whether it predicts.
      #
      # Same URL and same SHA256s OpenMS itself pins (src/openms/CMakeLists.txt).
      # The hash is the point: an unverified download turns a CDN into a
      # dependency that can change the numbers this suite asserts.
      - name: Restore the PeptDeep models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: models
          key: peptdeep-models-ccs41816f32-ms24141ea23-rt3f3b847e

      - name: Fetch the PeptDeep models
        if: steps.cache-models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          fetch() {
            curl -fsSL --retry 3 -o "models/$1" "http://archive.openms.de/openms/models/$1"
            echo "$2  models/$1" | shasum -a 256 -c -
          }
          # OpenMS lists the files as ccs, ms2, rt and the hashes in that same
          # order; pairing them by eye got rt and ccs swapped, and the check
          # below is the only reason that was noticed rather than shipped.
          fetch peptdeep_ccs_dynamic.onnx 41816f325cdd838897b7e7dcaf291da5d4d3903a1532fc5dc9db7e0725015801
          fetch peptdeep_ms2_dynamic.onnx 4141ea233d663b6f5b98ad80b8923ee685dae5cfdbe12243e2e30cd9c44ecf00
          fetch peptdeep_rt_dynamic.onnx  3f3b847ea37a9333ac163409f3d4b343d021471548091c61aed6cfa398ce62fd

      - name: Configure
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # QT_HOST_PATH: conda-forge's Qt6 for aarch64 and osx-arm64 is marked
          # as a cross-compiled Qt, so Qt6Config.cmake refuses to load without a
          # host Qt. This build is native, so the same prefix IS the host Qt.
          # x64 is unaffected, which is why it only shows up on the ARM legs.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DQT_HOST_PATH="$CONDA_PREFIX" \
            -DODIA_MODEL_DIR="$PWD/models" \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage"

      - name: Build
        shell: bash -el {0}
        run: cmake --build build -j

      - name: Test
        shell: bash -el {0}
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure
          # A test that is never ADDED does not fail -- it disappears. The
          # prediction tier is gated on the models being present, which is
          # exactly the condition that used to be false everywhere, so assert
          # the gate opened rather than trusting a green run.
          ctest --test-dir build -N | grep -q "peptdeep_predictions_match_reference" \
            || { echo "::error::the prediction tests were not registered -- models missing?"; exit 1; }

      - name: Install
        shell: bash -el {0}
        run: cmake --install build

      # ---------------------------------------------------------------------
      # The standalone-tool gates, against the INSTALLED tree.
      #
      # `env -i` is the load-bearing part: a runner that still has the build
      # tree on PATH, or OPENMS_DATA_PATH set, will happily pass a binary that
      # cannot stand on its own. OPENMS_DATA_PATH and the conda lib path are
      # passed back explicitly -- naming them is the difference between "the
      # binary needs these" and "the binary happened to inherit these".
      # ---------------------------------------------------------------------
      - name: The installed binary stands on its own
        shell: bash -el {0}
        run: |
          set -euo pipefail
          BIN="$PWD/stage/bin/DIALibraryGenerator"
          test -x "$BIN" || { echo "::error::no installed binary at $BIN"; exit 1; }

          # The data tables must be INSIDE the install, at the path the tool
          # searches. Before this they resolved to an absolute path in the
          # source tree, so an installed or relocated binary found nothing.
          test -s "$PWD/stage/share/DIALibraryGenerator/irt_standards.tsv" \
            || { echo "::error::the iRT standards are not in the install tree"; exit 1; }

          export OPENMS_DATA_PATH="$CONDA_PREFIX/share/OpenMS"
          export DYLD_FALLBACK_LIBRARY_PATH="$CONDA_PREFIX/lib"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib"
          bash test/standalone_test.sh "$BIN" \
            "$(sed -n 's/^  VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" \
            example/proteins.fasta
          bash test/write_ctd_test.sh "$BIN" || [ $? -eq 77 ]

      # End to end, against the INSTALLED binary and the real models: a FASTA in,
      # a library out, in both formats. Everything above proves the tool starts
      # and refuses bad input; this is the only step that proves it predicts.
      - name: Build a real library
        shell: bash -el {0}
        run: |
          set -euo pipefail
          export OPENMS_DATA_PATH="$CONDA_PREFIX/share/OpenMS"
          export DIALIBGEN_MODEL_DIR="$PWD/models"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib"
          export DYLD_FALLBACK_LIBRARY_PATH="$CONDA_PREFIX/lib"
          BIN="$PWD/stage/bin/DIALibraryGenerator"

          "$BIN" -in example/proteins.fasta -out out.parquet
          "$BIN" -in example/proteins.fasta -out out.tsv

          test -s out.parquet || { echo "::error::no Parquet library"; exit 1; }
          test -s out.tsv     || { echo "::error::no TSV library"; exit 1; }

          # A library with no rows is not a library, and a Parquet that does not
          # carry the recipe is the whole reason to prefer it over the TSV.
          python - <<'PY'
          import pyarrow.parquet as pq, json, sys
          f = pq.ParquetFile("out.parquet")
          n = f.metadata.num_rows
          if n == 0:
              sys.exit("::error::the Parquet library has no rows")
          md = f.schema_arrow.metadata or {}
          raw = md.get(b"odia.config_json")
          if not raw:
              sys.exit("::error::the Parquet library does not carry odia.config_json")
          cfg = json.loads(raw)
          for k in ("enzyme", "fixed_modifications", "schema_version"):
              if k not in cfg:
                  sys.exit(f"::error::the embedded recipe is missing {k!r}")
          print(f"library: {n} transitions, recipe embedded ({len(cfg)} keys)")
          PY

          # The TSV is the DIA-NN dialect: a header and at least one row.
          rows=$(wc -l < out.tsv)
          [ "$rows" -gt 1 ] || { echo "::error::the TSV library has no rows"; exit 1; }
          head -1 out.tsv | grep -q "PrecursorMz" \
            || { echo "::error::the TSV is not the DIA-NN dialect"; exit 1; }
          echo "tsv: $((rows - 1)) rows"

      - name: Package the CLI
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash -el {0}
        run: |
          set -euo pipefail
          tar -C stage -czf "DIALibraryGenerator-${{ matrix.name }}.tar.gz" .

      - uses: actions/upload-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: cli-${{ matrix.name }}
          path: DIALibraryGenerator-${{ matrix.name }}.tar.gz

  # The desktop GUI's own checks. They need no OpenMS and no models, so they run
  # on all three OSes in a couple of minutes and catch the frontend regressions
  # the C++ matrix never would.
  gui:
    name: gui-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
        working-directory: gui
      - run: npm run typecheck
        working-directory: gui
      - run: npm test
        working-directory: gui
      - run: npm run build
        working-directory: gui

      # The Rust side: its unit tests cover the trust boundary (which config
      # keys may reach the CLI, and how a dash-leading path is defanged), and
      # clippy is denied warnings so a lint does not accumulate until a release.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Tauri needs the system webview and its build dependencies on Linux.
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - run: cargo test
        working-directory: gui/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: gui/src-tauri
